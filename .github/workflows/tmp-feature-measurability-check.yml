name: Temporary Local Feature Consumer Check

on:
  pull_request:

concurrency:
  group: temporary-local-feature-consumer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  local-feature-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build local feature consumer
        shell: bash
        run: |
          set +e
          lake build MGAP4D.MathlibAnalytic.PhysicalYangMillsOrientedWilsonOSEvenPeriodicAmplitudeBoundedLocalKernelProduct > /tmp/local-feature-consumer.log 2>&1
          status=$?
          echo "$status" > /tmp/local-feature-consumer.status
          if [ "$status" -eq 0 ]; then
            echo "Local feature consumer build passed" | tee /tmp/local-feature-consumer-diagnostics.txt
          else
            {
              echo "Local feature consumer build failed; compact diagnostics follow"
              grep -n -B 4 -A 18 'error:' /tmp/local-feature-consumer.log || tail -n 160 /tmp/local-feature-consumer.log
            } | tee /tmp/local-feature-consumer-diagnostics.txt
          fi
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-feature-consumer-diagnostics
          path: /tmp/local-feature-consumer-diagnostics.txt
          if-no-files-found: error
      - name: Propagate build status
        if: always()
        shell: bash
        run: exit "$(cat /tmp/local-feature-consumer.status)"
