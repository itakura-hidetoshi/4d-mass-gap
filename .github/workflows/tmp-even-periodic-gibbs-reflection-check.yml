name: Temporary Even-Periodic Gibbs Reflection Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/tmp-even-periodic-gibbs-reflection-check.yml"
      - "MGAP4D/MathlibAnalytic/NormalizedCompactHaarInversion.lean"
      - "MGAP4D/MathlibAnalytic/PeriodicHypercubicEvenConfigurationReflection.lean"
      - "MGAP4D/MathlibAnalytic/PeriodicHypercubicEvenConfigurationHaarReflection.lean"
      - "MGAP4D/MathlibAnalytic/PeriodicHypercubicEvenConfigurationHaarMeasureReflection.lean"
      - "MGAP4D/MathlibAnalytic/PeriodicHypercubicEvenWilsonActionReflection.lean"
      - "MGAP4D/MathlibAnalytic/PeriodicHypercubicEvenGibbsReflection.lean"
      - "MGAP4D/MathlibAnalytic/PeriodicHypercubicEvenReflectionSectorCompileSmoke.lean"
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"

concurrency:
  group: tmp-even-periodic-gibbs-reflection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"
  LAKE_CACHE_REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Cache elan toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-

      - name: Restore Lake build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ env.LAKE_CACHE_REF_SHA }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-fast-lake-v4-
            ${{ runner.os }}-lean-fast-v3-
            ${{ runner.os }}-lean-fast-
            ${{ runner.os }}-lean-

      - name: Install Lean
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v elan >/dev/null 2>&1; then
            curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build target
        shell: bash
        run: |
          set -o pipefail
          lake build MGAP4D.MathlibAnalytic.PeriodicHypercubicEvenReflectionSectorCompileSmoke 2>&1 | tee /tmp/even-periodic-gibbs-reflection-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: even-periodic-gibbs-reflection-build-log
          path: /tmp/even-periodic-gibbs-reflection-build.log
          if-no-files-found: error
