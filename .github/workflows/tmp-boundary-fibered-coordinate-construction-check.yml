name: Temporary Boundary-Fibered Coordinate Construction Check

on:
  pull_request:

concurrency:
  group: temporary-boundary-fibered-coordinate-construction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  boundary-fibered-coordinate-construction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build boundary-fibered coordinate construction
        shell: bash
        run: |
          set +e
          lake build MGAP4D.MathlibAnalytic.PhysicalYangMillsOrientedWilsonOSBoundaryFiberedCoordinateConstruction > /tmp/boundary-fibered-coordinate-construction.log 2>&1
          status=$?
          echo "$status" > /tmp/boundary-fibered-coordinate-construction.status
          if [ "$status" -eq 0 ]; then
            echo "Boundary-fibered coordinate construction build passed" | tee /tmp/boundary-fibered-coordinate-construction-diagnostics.txt
          else
            {
              echo "Boundary-fibered coordinate construction build failed; compact diagnostics follow"
              grep -n -B 4 -A 28 'error:' /tmp/boundary-fibered-coordinate-construction.log || tail -n 240 /tmp/boundary-fibered-coordinate-construction.log
            } | tee /tmp/boundary-fibered-coordinate-construction-diagnostics.txt
          fi
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-fibered-coordinate-construction-diagnostics
          path: /tmp/boundary-fibered-coordinate-construction-diagnostics.txt
          if-no-files-found: error
      - name: Propagate build status
        if: always()
        shell: bash
        run: exit "$(cat /tmp/boundary-fibered-coordinate-construction.status)"
