name: Gibbs Hilbert Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/hilbert-diagnostic.yml"
      - "MGAP4D/MathlibAnalytic/FiniteWilsonGibbsHilbertRealization.lean"

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"

jobs:
  hilbert-diagnostic:
    name: Gibbs Hilbert leaf diagnostic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache elan toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-

      - name: Restore Lake build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-fast-lake-v4-
            ${{ runner.os }}-lean-fast-

      - name: Install elan
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v elan >/dev/null 2>&1; then
            curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build Gibbs Hilbert leaf
        id: lean-build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          lake build MGAP4D.MathlibAnalytic.FiniteWilsonGibbsHilbertRealization \
            2>&1 | tee hilbert-build.log

      - name: Upload Gibbs Hilbert diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hilbert-build-log
          path: hilbert-build.log
          if-no-files-found: error

      - name: Propagate build failure
        if: steps.lean-build.outcome == 'failure'
        shell: bash
        run: exit 1
