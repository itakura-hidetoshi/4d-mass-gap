name: Local Dobrushin Comparison Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/lane265-local-dobrushin-diagnostic.yml"

permissions:
  actions: read
  contents: read

jobs:
  diagnostic:
    name: Extract failed Lean diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Download failed Lean job log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/81849297915/logs" \
            -o failed-lean-job.log
          {
            echo "=== Lean errors ==="
            grep -n -C 4 -E "error:|failed to synthesize|unsolved goals|unknown constant|type mismatch|application type mismatch" failed-lean-job.log || true
            echo "=== Log tail ==="
            tail -n 260 failed-lean-job.log
          } > lane265-local-dobrushin.log
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: lane265-local-dobrushin-log
          path: lane265-local-dobrushin.log
          if-no-files-found: error
