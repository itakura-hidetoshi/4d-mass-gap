name: Random Scan Rayleigh Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/random-scan-rayleigh-diagnostic.yml"
      - "MGAP4D/MathlibAnalytic/FiniteWilsonCanonicalRandomScanRayleigh.lean"

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"

jobs:
  diagnostic:
    name: Random-scan Rayleigh full diagnostic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 200
      - uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-fast-lake-v4-
            ${{ runner.os }}-lean-fast-
      - name: Install elan
        shell: bash
        run: |
          if ! command -v elan >/dev/null 2>&1; then
            curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Run full changed-Lean check
        id: full-check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check_changed_lean.sh origin/main 2>&1 | tee random-scan-rayleigh-full.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: random-scan-rayleigh-full-log
          path: random-scan-rayleigh-full.log
          if-no-files-found: error
      - name: Propagate failure
        if: steps.full-check.outcome == 'failure'
        run: exit 1
