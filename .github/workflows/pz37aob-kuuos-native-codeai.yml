name: PZ37AOB KuuOS CodeAI direct Lean and real MCP

on:
  pull_request:
    paths:
      - "MGAP4D/MathlibAnalytic/PhysicalYangMillsWilsonSU2OriginalFirstHaarVolumeScaledDiagonalLimitV5_PZ37AOB.lean"
      - "scripts/pz37aob_*.py"
      - "scripts/pz37aob_candidate_strategies.json"
      - "scripts/test_pz37aob_codeai_candidate_pipeline.py"
      - ".github/workflows/pz37aob-kuuos-native-codeai.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pz37aob-codeai-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"

jobs:
  candidates-direct-mcp:
    name: Source-bound CodeAI candidates then direct Lean then real Lean MCP
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact AOB research HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false

      - name: Checkout immutable KuuOS runtime and MCP helpers
        uses: actions/checkout@v6
        with:
          repository: itakura-hidetoshi/KuuOS
          ref: 0dca3cc8a69ef523946a9ad4e07d0cc8f7394925
          path: _codeai_pinned
          sparse-checkout: |
            runtime
            scripts
          persist-credentials: false
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test evidence gates against false greens
        env:
          PYTHONPATH: "${{ github.workspace }}/_codeai_pinned"
        run: python3 scripts/test_pz37aob_codeai_candidate_pipeline.py

      - name: Restore exact Lean toolchain
        uses: actions/cache/restore@v5
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Restore pinned dependency artifacts
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lean-fast-deps-v1-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}

      - name: Restore certified AOA project artifacts
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: ${{ runner.os }}-lean-fast-project-v1-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-base-a9de90908d06791a9e2610de7aa6305a5cc676f6

      - name: Inspect fixed environment and install MCP launcher
        shell: bash
        run: |
          set -euo pipefail
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake --version
          python3 -m pip install --disable-pip-version-check uv
          uv --version

      - name: Execute pinned native CodeAI synthesis before testing
        env:
          KUUOS_CODEAI_PINNED_ROOT: "${{ github.workspace }}/_codeai_pinned"
          AOB_HEAD: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python3 scripts/pz37aob_codeai_candidate_pipeline.py --synthesize-only --verify-source-tree --output-dir "$RUNNER_TEMP/aob-codeai-preflight"

      - name: Validate exact imported dependencies with Lake
        shell: bash
        run: |
          set -euo pipefail
          lake build MGAP4D.MathlibAnalytic.PhysicalYangMillsWilsonSU2OriginalFirstHaarRightSlopeLimitV5_PZ37AOA Mathlib.Analysis.Normed.Group.Continuity Mathlib.Topology.Instances.NNReal.Lemmas Mathlib.Topology.Order.DenselyOrdered 2>&1 | tee "$RUNNER_TEMP/aob-import-build.log"

      - name: Check the right filter is nontrivial and maps to the real right filter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p codeai_candidates/PZ37AOB
          cat > codeai_candidates/PZ37AOB/FilterProbe.lean <<'LEAN'
          import Mathlib.Topology.Instances.NNReal.Lemmas
          import Mathlib.Topology.Order.DenselyOrdered
          open Filter
          open scoped Topology NNReal
          #synth NeBot (𝓝[>] (0 : ℝ≥0))
          #check NNReal.map_coe_nhdsGT
          LEAN
          lake env lean -DwarningAsError=true codeai_candidates/PZ37AOB/FilterProbe.lean 2>&1 | tee "$RUNNER_TEMP/aob-filter-probe.log"

      - name: Generate candidates then directly compile then verify successful bytes through actual Lean MCP
        env:
          KUUOS_CODEAI_PINNED_ROOT: "${{ github.workspace }}/_codeai_pinned"
          AOB_HEAD: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python3 scripts/pz37aob_codeai_candidate_pipeline.py --output-dir "$RUNNER_TEMP/aob-codeai"

      - name: Archive candidate sources full logs MCP receipts and native learning holds
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: PZ37AOB-kuuos-codeai-direct-mcp-evidence
          path: |
            ${{ runner.temp }}/aob-codeai/
            ${{ runner.temp }}/aob-codeai-preflight/
            ${{ runner.temp }}/aob-import-build.log
            ${{ runner.temp }}/aob-filter-probe.log
          if-no-files-found: error
          retention-days: 30
