name: PZ37AQB full-cache sandbox v2 exact notation and dependency repair
on:
  pull_request:
    paths:
      - "diagnostics/pz37aqb/full-v2-r4-r6/**"
      - ".github/workflows/pz37aqb-full-v2-r4-r6.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37aqb-full-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-diagnostic-full-v1.yml
    with:
      pack: diagnostics/pz37aqb/full-v2-r4-r6/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: dec4f1b1ab5c4a686f4a53662f014636b9c74a7e
