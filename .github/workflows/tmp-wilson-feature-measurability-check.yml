name: Temporary Holonomy Measurability Consumer Check

on:
  pull_request:

concurrency:
  group: temporary-holonomy-measurability-consumer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  holonomy-measurability-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build holonomy measurability consumer
        shell: bash
        run: |
          set +e
          lake build MGAP4D.MathlibAnalytic.PhysicalYangMillsOrientedWilsonOSEvenPeriodicHolonomyMeasurableAmplitudeBoundedLocalKernelProduct > /tmp/holonomy-consumer.log 2>&1
          status=$?
          echo "$status" > /tmp/holonomy-consumer.status
          if [ "$status" -eq 0 ]; then
            echo "Holonomy measurability consumer build passed" | tee /tmp/holonomy-consumer-diagnostics.txt
          else
            {
              echo "Holonomy measurability consumer build failed; compact diagnostics follow"
              grep -n -B 4 -A 20 'error:' /tmp/holonomy-consumer.log || tail -n 180 /tmp/holonomy-consumer.log
            } | tee /tmp/holonomy-consumer-diagnostics.txt
          fi
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holonomy-consumer-diagnostics
          path: /tmp/holonomy-consumer-diagnostics.txt
          if-no-files-found: error
      - name: Propagate build status
        if: always()
        shell: bash
        run: exit "$(cat /tmp/holonomy-consumer.status)"
