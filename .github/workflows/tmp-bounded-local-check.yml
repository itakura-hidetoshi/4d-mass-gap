name: Temporary RKHS Check

on:
  pull_request:

concurrency:
  group: temporary-rkhs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rkhs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build RKHS bridge
        shell: bash
        run: |
          set +e
          lake build MGAP4D.MathlibAnalytic.RealKernelPositiveSemidefiniteRKHS > /tmp/rkhs.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "RKHS bridge build passed"
          else
            echo "RKHS bridge build failed; compact diagnostics follow"
            grep -n -B 3 -A 12 'error:' /tmp/rkhs.log || tail -n 100 /tmp/rkhs.log
          fi
          exit "$status"
