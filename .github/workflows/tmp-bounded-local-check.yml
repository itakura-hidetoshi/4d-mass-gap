name: Temporary RKHS Check

on:
  pull_request:

concurrency:
  group: temporary-rkhs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rkhs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build RKHS consumer
        shell: bash
        run: |
          set +e
          lake build MGAP4D.MathlibAnalytic.PhysicalYangMillsOrientedWilsonOSEvenPeriodicAmplitudeBoundedLocalKernelProduct > /tmp/rkhs.log 2>&1
          status=$?
          echo "$status" > /tmp/rkhs.status
          if [ "$status" -eq 0 ]; then
            echo "RKHS consumer build passed" | tee /tmp/rkhs-diagnostics.txt
          else
            {
              echo "RKHS consumer build failed; compact diagnostics follow"
              grep -n -B 3 -A 16 'error:' /tmp/rkhs.log || tail -n 120 /tmp/rkhs.log
            } | tee /tmp/rkhs-diagnostics.txt
          fi
          exit 0
      - name: Upload RKHS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rkhs-diagnostics
          path: /tmp/rkhs-diagnostics.txt
          if-no-files-found: error
      - name: Propagate RKHS build status
        if: always()
        shell: bash
        run: exit "$(cat /tmp/rkhs.status)"
