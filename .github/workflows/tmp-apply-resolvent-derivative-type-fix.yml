name: Apply resolvent derivative type fix

on:
  push:
    branches:
      - physical-4d-yang-mills-measure-limit
    paths:
      - ".github/workflows/tmp-apply-resolvent-derivative-type-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply exact Lean replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("MGAP4D/MathlibAnalytic/PhysicalYangMillsGaugeInvariantOSVacuumOrthogonalRealResolventDerivative.lean")
          text = path.read_text()

          old1 = '''      lambda :=
            (G.vacuumOrthogonalRealResolventOn_hasDerivWithinAt
              T hP hSelf hlambda).hasDerivAt (Iio_mem_nhds hlambda)
          '''
          new1 = '''      lambda := by
            have hwithin :
                HasDerivWithinAt
                  (G.vacuumOrthogonalRealResolventOn T hP hSelf)
                  ((G.vacuumOrthogonalRealResolvent T hP hSelf hlambda).comp
                    (G.vacuumOrthogonalRealResolvent T hP hSelf hlambda))
                  (Set.Iio G.mass) lambda :=
              G.vacuumOrthogonalRealResolventOn_hasDerivWithinAt
                T hP hSelf hlambda
            exact hwithin.hasDerivAt (Iio_mem_nhds hlambda)
          '''

          old2 = '''        (G.vacuumOrthogonalRealResolvent T hP hSelf hlambda) :=
            (G.vacuumOrthogonalRealResolventOn_hasDerivAt
              T hP hSelf hlambda).deriv
          '''
          new2 = '''        (G.vacuumOrthogonalRealResolvent T hP hSelf hlambda) := by
            have hderiv :
                HasDerivAt
                  (G.vacuumOrthogonalRealResolventOn T hP hSelf)
                  ((G.vacuumOrthogonalRealResolvent T hP hSelf hlambda).comp
                    (G.vacuumOrthogonalRealResolvent T hP hSelf hlambda))
                  lambda :=
              G.vacuumOrthogonalRealResolventOn_hasDerivAt
                T hP hSelf hlambda
            exact hderiv.deriv
          '''

          old3 = '''        intro lambda hlambda
            exact
              (G.vacuumOrthogonalRealResolventOn_hasDerivWithinAt
                T hP hSelf hlambda).differentiableWithinAt
          '''
          new3 = '''        intro lambda hlambda
            have hwithin :
                HasDerivWithinAt
                  (G.vacuumOrthogonalRealResolventOn T hP hSelf)
                  ((G.vacuumOrthogonalRealResolvent T hP hSelf hlambda).comp
                    (G.vacuumOrthogonalRealResolvent T hP hSelf hlambda))
                  (Set.Iio G.mass) lambda :=
              G.vacuumOrthogonalRealResolventOn_hasDerivWithinAt
                T hP hSelf hlambda
            exact hwithin.differentiableWithinAt
          '''

          for old, new in ((old1, new1), (old2, new2), (old3, new3)):
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match, found {text.count(old)}")
              text = text.replace(old, new)

          path.write_text(text)
          Path(".github/workflows/tmp-apply-resolvent-derivative-type-fix.yml").unlink()
          PY

      - name: Commit patched source and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MGAP4D/MathlibAnalytic/PhysicalYangMillsGaugeInvariantOSVacuumOrthogonalRealResolventDerivative.lean
          git add -u .github/workflows/tmp-apply-resolvent-derivative-type-fix.yml
          git commit -m "Fix excitation derivative type inference"
          git push origin HEAD:${GITHUB_REF_NAME}
