name: Wilson Shared Plaquette Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/wilson-shared-plaquette-diagnostic.yml"
      - "MGAP4D/MathlibAnalytic/FiniteLatticeWilsonSharedPlaquetteEnergyGap.lean"
      - "MGAP4D/MathlibAnalytic/FiniteLatticeWilsonActionLocalDecompositionSmoke.lean"

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-fast-
      - name: Install elan
        run: |
          if ! command -v elan >/dev/null 2>&1; then
            curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Strict-check shared plaquette energy gap
        continue-on-error: true
        run: |
          set -o pipefail
          lake env lean -DautoImplicit=false MGAP4D/MathlibAnalytic/FiniteLatticeWilsonSharedPlaquetteEnergyGap.lean 2>&1 | tee wilson-shared-plaquette-gap.log
      - name: Strict-check consolidated smoke
        continue-on-error: true
        run: |
          set -o pipefail
          lake env lean -DautoImplicit=false MGAP4D/MathlibAnalytic/FiniteLatticeWilsonActionLocalDecompositionSmoke.lean 2>&1 | tee wilson-shared-plaquette-smoke.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wilson-shared-plaquette-strict-logs
          path: |
            wilson-shared-plaquette-gap.log
            wilson-shared-plaquette-smoke.log
