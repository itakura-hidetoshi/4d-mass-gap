name: Wilson Shared Plaquette Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/wilson-shared-plaquette-diagnostic.yml"
      - "MGAP4D/MathlibAnalytic/FiniteLatticeWilsonSharedPlaquetteEnergyGap.lean"
      - "MGAP4D/MathlibAnalytic/FiniteLatticeWilsonActionLocalDecompositionSmoke.lean"
      - "scripts/lean_feedback_classifier.py"

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-fast-
      - name: Install elan
        run: |
          if ! command -v elan >/dev/null 2>&1; then
            curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and strict-check shared plaquette energy gap
        id: gap
        shell: bash
        run: |
          set -uo pipefail
          build_exit=0
          strict_exit=0
          lake build MGAP4D.MathlibAnalytic.FiniteLatticeWilsonSharedPlaquetteEnergyGap \
            2>&1 | tee wilson-shared-plaquette-gap-build.log || build_exit=$?
          if [ "${build_exit}" -eq 0 ]; then
            lake env lean -DautoImplicit=false \
              MGAP4D/MathlibAnalytic/FiniteLatticeWilsonSharedPlaquetteEnergyGap.lean \
              2>&1 | tee wilson-shared-plaquette-gap-strict.log || strict_exit=$?
          else
            strict_exit=125
            echo "strict check skipped because dependency-aware build failed" \
              | tee wilson-shared-plaquette-gap-strict.log
          fi
          cat wilson-shared-plaquette-gap-build.log \
              wilson-shared-plaquette-gap-strict.log \
              > wilson-shared-plaquette-gap.log
          overall_exit="${build_exit}"
          if [ "${overall_exit}" -eq 0 ]; then
            overall_exit="${strict_exit}"
          fi
          python3 scripts/lean_feedback_classifier.py \
            --exit-code "${overall_exit}" --pretty \
            wilson-shared-plaquette-gap.log \
            > wilson-shared-plaquette-gap-feedback.json
          cat wilson-shared-plaquette-gap-feedback.json
          echo "exit_code=${overall_exit}" >> "$GITHUB_OUTPUT"
      - name: Build and strict-check consolidated smoke
        id: smoke
        shell: bash
        run: |
          set -uo pipefail
          build_exit=0
          strict_exit=0
          lake build MGAP4D.MathlibAnalytic.FiniteLatticeWilsonActionLocalDecompositionSmoke \
            2>&1 | tee wilson-shared-plaquette-smoke-build.log || build_exit=$?
          if [ "${build_exit}" -eq 0 ]; then
            lake env lean -DautoImplicit=false \
              MGAP4D/MathlibAnalytic/FiniteLatticeWilsonActionLocalDecompositionSmoke.lean \
              2>&1 | tee wilson-shared-plaquette-smoke-strict.log || strict_exit=$?
          else
            strict_exit=125
            echo "strict check skipped because dependency-aware build failed" \
              | tee wilson-shared-plaquette-smoke-strict.log
          fi
          cat wilson-shared-plaquette-smoke-build.log \
              wilson-shared-plaquette-smoke-strict.log \
              > wilson-shared-plaquette-smoke.log
          overall_exit="${build_exit}"
          if [ "${overall_exit}" -eq 0 ]; then
            overall_exit="${strict_exit}"
          fi
          python3 scripts/lean_feedback_classifier.py \
            --exit-code "${overall_exit}" --pretty \
            wilson-shared-plaquette-smoke.log \
            > wilson-shared-plaquette-smoke-feedback.json
          cat wilson-shared-plaquette-smoke-feedback.json
          echo "exit_code=${overall_exit}" >> "$GITHUB_OUTPUT"
      - name: Upload logs and feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wilson-shared-plaquette-strict-logs
          path: |
            wilson-shared-plaquette-*.log
            wilson-shared-plaquette-*-feedback.json
      - name: Propagate diagnostic failure
        if: steps.gap.outputs.exit_code != '0' || steps.smoke.outputs.exit_code != '0'
        run: exit 1
