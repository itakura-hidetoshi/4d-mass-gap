name: PZ37AQF full-cache sandbox v2 finite dyadic OS threshold
on:
  pull_request:
    paths:
      - "diagnostics/pz37aqf/full-v2-r3-r4/**"
      - ".github/workflows/pz37aqf-full-v2-r3-r4.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37aqf-full-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-aqf-full-v2.yml
    with:
      pack: diagnostics/pz37aqf/full-v2-r3-r4/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: dd6898fa5306850ea5dc4c0a91cd26a8fec1d81f
