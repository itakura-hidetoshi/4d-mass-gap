name: PZ37APJ warm sandbox v2 R2 R3 exact two-mode direction
on:
  pull_request:
    paths:
      - "diagnostics/pz37apj/warm-v2-r2-r3/**"
      - ".github/workflows/pz37apj-warm-v2-r2-r3.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37apj-warm-v2-r2-r3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-v2.yml
    with:
      pack: diagnostics/pz37apj/warm-v2-r2-r3/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: d1dc9b9969a21b2d1385e25b610e6f92081df275
