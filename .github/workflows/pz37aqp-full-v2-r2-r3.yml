name: PZ37AQP full-cache sandbox v2 genuine vacuum-weighted probe floor
on:
  pull_request:
    paths:
      - "diagnostics/pz37aqp/full-v2-r2-r3/**"
      - ".github/workflows/pz37aqp-full-v2-r2-r3.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37aqp-full-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-aqp-full-v2.yml
    with:
      pack: diagnostics/pz37aqp/full-v2-r2-r3/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: d401555b432add745150c1c28d3e54a0fae59e64
