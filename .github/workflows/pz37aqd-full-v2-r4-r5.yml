name: PZ37AQD full-cache sandbox v2 local Wilson synthesis image shift
on:
  pull_request:
    paths:
      - "diagnostics/pz37aqd/full-v2-r4-r5/**"
      - ".github/workflows/pz37aqd-full-v2-r4-r5.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37aqd-full-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-aqd-full-v2.yml
    with:
      pack: diagnostics/pz37aqd/full-v2-r4-r5/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: 3a7a9244b88ee99cc5dbc2e26435b1e458f809e7
