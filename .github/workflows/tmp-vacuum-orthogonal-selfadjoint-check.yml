name: Temporary Vacuum Orthogonal SelfAdjoint Check

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-vacuum-orthogonal-selfadjoint-check.yml"
      - "MGAP4D/MathlibAnalytic/PhysicalYangMillsGaugeInvariantOSVacuumOrthogonalSelfAdjoint.lean"
      - "MGAP4D/MathlibAnalytic/PhysicalYangMillsGaugeInvariantOSVacuumOrthogonalDenseDomain.lean"
      - "MGAP4D/MathlibAnalytic/PhysicalYangMillsGaugeInvariantOSVacuumOrthogonalHamiltonian.lean"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Cache elan
        uses: actions/cache@v5
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-

      - name: Restore Lake cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-vacuum-orthogonal-selfadjoint-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vacuum-orthogonal-selfadjoint-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-

      - name: Install Lean
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if ! command -v elan >/dev/null 2>&1; then
            curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lean --version
          lake --version

      - name: Build and capture diagnostic
        id: build
        shell: bash
        run: |
          set -uo pipefail
          set +e
          lake build MGAP4D.MathlibAnalytic.PhysicalYangMillsGaugeInvariantOSVacuumOrthogonalSelfAdjoint \
            > /tmp/vacuum-orthogonal-selfadjoint.log 2>&1
          status=$?
          set -e
          tail -n 500 /tmp/vacuum-orthogonal-selfadjoint.log \
            > /tmp/vacuum-orthogonal-selfadjoint-tail.log
          cat /tmp/vacuum-orthogonal-selfadjoint-tail.log
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vacuum-orthogonal-selfadjoint-diagnostic
          path: |
            /tmp/vacuum-orthogonal-selfadjoint.log
            /tmp/vacuum-orthogonal-selfadjoint-tail.log
          if-no-files-found: error

      - name: Save target Lake cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-vacuum-orthogonal-selfadjoint-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.sha }}

      - name: Propagate build status
        if: always()
        run: exit "${{ steps.build.outputs.status }}"
