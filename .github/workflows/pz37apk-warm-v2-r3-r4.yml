name: PZ37APK warm sandbox v2 exact OS boundary determinant R3 R4
on:
  pull_request:
    paths:
      - "diagnostics/pz37apk/warm-v2-r3-r4/**"
      - ".github/workflows/pz37apk-warm-v2-r3-r4.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37apk-warm-v2-r3-r4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-v2.yml
    with:
      pack: diagnostics/pz37apk/warm-v2-r3-r4/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: ff78e740988ea77fccfc6bdd0a8bbf451806e19c
