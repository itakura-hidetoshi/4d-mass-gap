name: PZ37AQV full-cache sandbox v1 uniform weighted norm and normalized test
on:
  pull_request:
    paths:
      - "diagnostics/pz37aqv/full-v1-r1/**"
      - ".github/workflows/pz37aqv-full-v1-r1.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37aqv-full-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-aqv-full-v1.yml
    with:
      pack: diagnostics/pz37aqv/full-v1-r1/pack-r1.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: f39214d4fa798f5b9727d65a446382fe7347a349
