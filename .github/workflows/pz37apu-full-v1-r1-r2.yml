name: PZ37APU full-cache sandbox v1 R1/R2 completed OS kernel coordinate seam
on:
  pull_request:
    paths:
      - "diagnostics/pz37apu/full-v1-r1-r2/**"
      - ".github/workflows/pz37apu-full-v1-r1-r2.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37apu-full-v1-r1-r2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-diagnostic-full-v1.yml
    with:
      pack: diagnostics/pz37apu/full-v1-r1-r2/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: 5364c87094828e8a6aef95c7ed49fdd63ac156b6
