name: MGAP4D KuuOS CI Completion Sender v0.1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/kuuos-ci-completion-sender-v0-1.yml"
      - "scripts/kuuos_ci_completion_sender_v0_1.py"
      - "scripts/kuuos_ci_completion_source_inbox_v0_2.py"
      - "docs/kuuos_ci_completion_sender_v0_1.md"
      - "docs/kuuos_ci_completion_source_inbox_v0_2.md"
  workflow_run:
    workflows:
      - "PR Lean Fast Check"
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: mgap4d-kuuos-ci-completion-sender-v01-${{ github.event.workflow_run.id || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' }}
    name: Validate sender boundary
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout default-branch sender code
        uses: actions/checkout@v6

      - name: Run deterministic sender self-checks
        run: |
          set -euo pipefail
          python3 scripts/kuuos_ci_completion_sender_v0_1.py --self-check
          python3 scripts/kuuos_ci_completion_source_inbox_v0_2.py --self-check

  send:
    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    name: Persist and send bounded completion signal
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default-branch sender code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Run deterministic sender self-checks
        run: |
          set -euo pipefail
          python3 scripts/kuuos_ci_completion_sender_v0_1.py --self-check
          python3 scripts/kuuos_ci_completion_source_inbox_v0_2.py --self-check

      - name: Fetch exact completed source-run jobs and steps
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/kuuos-ci-completion"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?filter=latest&per_page=100" \
            > "${RUNNER_TEMP}/kuuos-ci-completion/source-jobs.json"

      - name: Compile exact KuuOS repository-dispatch packet
        run: |
          set -euo pipefail
          python3 scripts/kuuos_ci_completion_sender_v0_1.py \
            --event "${GITHUB_EVENT_PATH}" \
            --jobs-json "${RUNNER_TEMP}/kuuos-ci-completion/source-jobs.json" \
            --output "${RUNNER_TEMP}/kuuos-ci-completion/dispatch.json"

      - name: Compile durable same-repository MCP inbox record
        run: |
          set -euo pipefail
          python3 scripts/kuuos_ci_completion_source_inbox_v0_2.py \
            --sender-result "${RUNNER_TEMP}/kuuos-ci-completion/dispatch.json" \
            --output-dir "${RUNNER_TEMP}/kuuos-ci-completion/source-inbox"

      - name: Persist deduplicated source-side pending Issue
        id: source_inbox
        env:
          SOURCE_INBOX_TOKEN: ${{ github.token }}
          SOURCE_INBOX_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kuuos-ci-completion" / "source-inbox"
          spec = json.loads((root / "source_inbox_issue_spec.json").read_text(encoding="utf-8"))
          token = os.environ["SOURCE_INBOX_TOKEN"]
          repository = os.environ["SOURCE_INBOX_REPOSITORY"]
          owner, repo = repository.split("/", 1)
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "MGAP4D-KuuOS-CI-Source-Inbox-v0.2",
          }

          query = urllib.parse.urlencode({"q": spec["dedupe_query"], "per_page": 100})
          request = urllib.request.Request(
              f"https://api.github.com/search/issues?{query}", headers=headers
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              search = json.load(response)
          exact = [item for item in search.get("items", []) if item.get("title") == spec["title"]]

          receipt = {
              "version": "mgap4d_kuuos_ci_completion_source_issue_receipt_v0_2",
              "issue_key": spec["issue_key"],
              "title": spec["title"],
              "created": False,
              "deduplicated": bool(exact),
          }
          if exact:
              issue = exact[0]
          else:
              body = json.dumps(
                  {"title": spec["title"], "body": spec["body"]},
                  ensure_ascii=False,
              ).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{owner}/{repo}/issues",
                  data=body,
                  headers={**headers, "Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  issue = json.load(response)
              receipt["created"] = True

          receipt.update(
              {
                  "issue_number": issue.get("number"),
                  "issue_url": issue.get("html_url"),
                  "issue_state": issue.get("state"),
                  "source_issue_is_success_evidence": False,
                  "fresh_mcp_reobservation_required_before_ack": True,
                  "merge_authority_granted": False,
                  "write_authority_granted": False,
              }
          )
          (root / "source_inbox_issue_receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(
              "MGAP4D_KUUOS_SOURCE_INBOX_ISSUE="
              f"{receipt['issue_number']} created={receipt['created']} deduplicated={receipt['deduplicated']}"
          )
          pathlib.Path(os.environ["GITHUB_OUTPUT"]).write_text(
              f"issue_number={receipt['issue_number']}\n"
              f"created={str(receipt['created']).lower()}\n"
              f"deduplicated={str(receipt['deduplicated']).lower()}\n",
              encoding="utf-8",
          )
          PY

      - name: Dispatch to KuuOS when cross-repository authority is configured
        id: dispatch
        env:
          KUUOS_CI_REENTRY_TOKEN: ${{ secrets.KUUOS_CI_REENTRY_TOKEN }}
        run: |
          set -euo pipefail
          packet="${RUNNER_TEMP}/kuuos-ci-completion/dispatch.json"
          if [ -z "${KUUOS_CI_REENTRY_TOKEN:-}" ]; then
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "dispatched=false" >> "${GITHUB_OUTPUT}"
            echo "KUUOS_CI_REENTRY_TOKEN_NOT_CONFIGURED: KuuOS mirror dispatch withheld; source durable Issue already persists the event"
            exit 0
          fi

          python3 - "${packet}" "${RUNNER_TEMP}/kuuos-ci-completion/request-body.json" <<'PY'
          import json
          import pathlib
          import sys

          source = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if source.get("dispatch_allowed") is not True:
              raise SystemExit("dispatch packet is not admitted")
          pathlib.Path(sys.argv[2]).write_text(
              json.dumps(source["dispatch"], separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

          http_code="$(curl \
            --silent \
            --show-error \
            --output "${RUNNER_TEMP}/kuuos-ci-completion/dispatch-response.txt" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${KUUOS_CI_REENTRY_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@${RUNNER_TEMP}/kuuos-ci-completion/request-body.json" \
            "${GITHUB_API_URL}/repos/itakura-hidetoshi/KuuOS/dispatches")"
          if [ "${http_code}" != "204" ]; then
            echo "KuuOS repository dispatch failed with HTTP ${http_code}" >&2
            cat "${RUNNER_TEMP}/kuuos-ci-completion/dispatch-response.txt" >&2 || true
            exit 1
          fi
          echo "configured=true" >> "${GITHUB_OUTPUT}"
          echo "dispatched=true" >> "${GITHUB_OUTPUT}"
          echo "KUUOS_CI_COMPLETION_DISPATCH_ACCEPTED"

      - name: Upload non-secret sender and source-inbox evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: kuuos-ci-completion-sender-${{ github.event.workflow_run.id }}
          path: |
            ${{ runner.temp }}/kuuos-ci-completion/dispatch.json
            ${{ runner.temp }}/kuuos-ci-completion/source-jobs.json
            ${{ runner.temp }}/kuuos-ci-completion/source-inbox/source_inbox_result.json
            ${{ runner.temp }}/kuuos-ci-completion/source-inbox/source_inbox_record.json
            ${{ runner.temp }}/kuuos-ci-completion/source-inbox/source_inbox_issue_spec.json
            ${{ runner.temp }}/kuuos-ci-completion/source-inbox/source_inbox_issue_receipt.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish sender summary
        if: ${{ always() }}
        run: |
          {
            echo '## MGAP4D → KuuOS CI completion sender'
            echo
            echo '- Source workflow: `PR Lean Fast Check`'
            echo '- Required job: `Changed Lean fast check`'
            echo '- Required step: `Run changed Lean fast check`'
            echo '- Canonical PR base: `formal/real-hilbert-uniform-coercive-strong-limit`'
            echo '- Durable source Issue: `#${{ steps.source_inbox.outputs.issue_number || 'not-created' }}`'
            echo '- Source persistence requires no cross-repository secret.'
            echo '- Cross-repository authority configured: `${{ steps.dispatch.outputs.configured || 'false' }}`'
            echo '- KuuOS mirror dispatch accepted: `${{ steps.dispatch.outputs.dispatched || 'false' }}`'
            echo '- Both Issue and dispatch are wake-up signals only; exact CI must be freshly reobserved through MCP before acknowledgement.'
          } >> "${GITHUB_STEP_SUMMARY}"
