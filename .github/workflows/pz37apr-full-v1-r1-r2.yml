name: PZ37APR full-cache sandbox v1 original OS centered boundary Hilbert-Schmidt physical compression
on:
  pull_request:
    paths:
      - "diagnostics/pz37apr/full-v1-r1-r2/**"
      - ".github/workflows/pz37apr-full-v1-r1-r2.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37apr-full-v1-r1-r2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-diagnostic-full-v1.yml
    with:
      pack: diagnostics/pz37apr/full-v1-r1-r2/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: ad57a0adfbc7a1ba8d8a2f1f155ad4e8d582288f
