name: Coercive Gap Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/coercive-gap-diagnostic.yml"
      - "MGAP4D/MathlibAnalytic/SymmetricEigenvalueLowerBound.lean"
      - "MGAP4D/MathlibAnalytic/FiniteWilsonOSAutomaticExactGapCoerciveTransferOrbitContraction.lean"
      - "MGAP4D/MathlibAnalytic/FiniteWilsonGibbsSingleSourceCoerciveTransferOrbitOSLimitAssembly.lean"

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"
  LAKE_CACHE_REF_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/cache@v5
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-
      - uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ env.LAKE_CACHE_REF_SHA }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-fast-lake-v4-
            ${{ runner.os }}-lean-fast-v3-
            ${{ runner.os }}-lean-fast-
            ${{ runner.os }}-lean-
      - name: Install Lean
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if ! command -v elan >/dev/null 2>&1; then
            curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Capture first failure
        shell: bash
        run: |
          set +e
          : > /tmp/full.log
          for target in \
            MGAP4D.MathlibAnalytic.SymmetricEigenvalueLowerBound \
            MGAP4D.MathlibAnalytic.FiniteWilsonOSAutomaticExactGapCoerciveTransferOrbitContractionCompileSmoke \
            MGAP4D.MathlibAnalytic.FiniteWilsonGibbsSingleSourceCoerciveTransferOrbitOSLimitAssemblyCompileSmoke
          do
            echo "=== $target ===" >> /tmp/full.log
            lake build "$target" >> /tmp/full.log 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then break; fi
          done
          echo "$status" > /tmp/status.txt
          grep -n -B 10 -A 60 -E 'error:|unsolved goals|Application type mismatch|failed to synthesize|tactic.*failed|Invalid field' /tmp/full.log > /tmp/errors.txt || tail -n 240 /tmp/full.log > /tmp/errors.txt
          exit 0
      - uses: actions/cache/save@v5
        with:
          path: |
            /tmp/errors.txt
            /tmp/status.txt
          key: coercive-gap-errors-${{ github.event.pull_request.head.sha }}

  report:
    if: always()
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v5
        with:
          path: |
            /tmp/errors.txt
            /tmp/status.txt
          key: coercive-gap-errors-${{ github.event.pull_request.head.sha }}
          fail-on-cache-miss: true
      - run: |
          cat /tmp/errors.txt
          test "$(cat /tmp/status.txt)" -eq 0
