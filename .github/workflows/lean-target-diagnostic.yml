name: Lean Target Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/lean-target-diagnostic.yml"
      - "MGAP4D/MathlibAnalytic/FiniteWilsonGibbsSingleSourceFiniteDiscreteRoutes.lean"
      - "MGAP4D/MathlibAnalytic/FiniteWilsonGibbsSingleSourceFiniteDiscreteRoutesCompileSmoke.lean"

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"
  LAKE_CACHE_REF_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/cache@v5
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-

      - uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ env.LAKE_CACHE_REF_SHA }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-fast-lake-v4-
            ${{ runner.os }}-lean-

      - name: Install elan
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v elan >/dev/null 2>&1; then
            curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Compile target and save complete error
        shell: bash
        run: |
          set +e
          lake env lean MGAP4D/MathlibAnalytic/FiniteWilsonGibbsSingleSourceFiniteDiscreteRoutes.lean > lean-target-diagnostic.log 2>&1
          status=$?
          cat lean-target-diagnostic.log
          echo "$status" > lean-target-status.txt
          exit 0

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: lean-target-diagnostic
          path: |
            lean-target-diagnostic.log
            lean-target-status.txt
          retention-days: 1
