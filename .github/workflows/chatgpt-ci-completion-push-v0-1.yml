name: ChatGPT CI Completion Push v0.1

on:
  workflow_run:
    workflows:
      - "PR Lean Fast Check"
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: chatgpt-ci-completion-push-v01-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      ${{
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.status == 'completed' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    name: Emit bounded PR completion wake-up
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Run PR-resolution regression tests
        run: python3 -m unittest -v tests.test_chatgpt_ci_completion_push_v0_2

      - name: Publish deduplicated PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_PULL_REQUESTS_JSON: ${{ toJson(github.event.workflow_run.pull_requests) }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
          USER_AGENT: MGAP4D-ChatGPT-CI-Completion-Push-v0.2
        run: python3 scripts/chatgpt_ci_completion_push_v0_2.py

      - name: Publish non-authority summary
        if: always()
        run: |
          {
            echo '## ChatGPT CI Completion Push v0.1 / resolver v0.2'
            echo
            echo '- Trigger: `workflow_run: completed` for `PR Lean Fast Check`.'
            echo '- If `workflow_run.pull_requests` is empty, resolve the PR once from the completed run `head_sha` via GitHub commit association.'
            echo '- Exact head SHA and repository identity are required for fallback association.'
            echo '- Delivery surfaces: deduplicated pull-request comment plus an exact-head GitHub commit-status receipt readable through MCP.'
            echo '- The comment and commit status are wake-up receipts only, not CI truth.'
            echo '- MCP backstop: read commit status context `chatgpt-ci-receipt/PR Lean Fast Check`, then fresh-read the exact Actions run/jobs before governed action.'
            echo '- Existing durable sender/source-inbox remains independent fallback storage.'
          } >> "$GITHUB_STEP_SUMMARY"
