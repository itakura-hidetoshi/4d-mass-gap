name: PZ37APL warm sandbox v2 positive vacuum weighted insertion
on:
  pull_request:
    paths:
      - "diagnostics/pz37apl/warm-v2-r1-r2/**"
      - ".github/workflows/pz37apl-warm-v2-r1-r2.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37apl-warm-v2-r1-r2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-v2.yml
    with:
      pack: diagnostics/pz37apl/warm-v2-r1-r2/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: 86f0556488d82767cd5e1f2a0210c8ff0fc8b771
