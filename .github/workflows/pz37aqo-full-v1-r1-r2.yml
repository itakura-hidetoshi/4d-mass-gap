name: PZ37AQO full-cache sandbox v1 genuine endpoint tensor lower bound
on:
  pull_request:
    paths:
      - "diagnostics/pz37aqo/full-v1-r1-r2/**"
      - ".github/workflows/pz37aqo-full-v1-r1-r2.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37aqo-full-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-aqo-full-v1.yml
    with:
      pack: diagnostics/pz37aqo/full-v1-r1-r2/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: 5011764ce548e898afdfa0d85173eee707327ea5
