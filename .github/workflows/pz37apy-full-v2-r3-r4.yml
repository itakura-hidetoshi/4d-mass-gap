name: PZ37APY full-cache sandbox v1 R3/R4 completed OS vacuum-line obstruction
on:
  pull_request:
    paths:
      - "diagnostics/pz37apy/full-v2-r3-r4/**"
      - ".github/workflows/pz37apy-full-v2-r3-r4.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37apy-full-v2-r3-r4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-diagnostic-full-v1.yml
    with:
      pack: diagnostics/pz37apy/full-v2-r3-r4/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: 71a0685b122302d6b21315044b287e1406b21e23
