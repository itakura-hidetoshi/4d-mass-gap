name: PZ37APH signed mixed Wilson row warm sandbox v2
on:
  pull_request:
    paths:
      - "diagnostics/pz37aph/warm-v2/**"
      - ".github/workflows/pz37aph-warm-v2.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37aph-warm-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-v2.yml
    with:
      pack: diagnostics/pz37aph/warm-v2/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: 472599cadca0f019bcbdbef3e6087d249166ff0e
