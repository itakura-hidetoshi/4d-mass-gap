name: Hilbert Layer Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/hilbert-layer-diagnostic.yml"
      - "MGAP4D/MathlibAnalytic/FiniteWilsonOSAutomaticExactGapHilbertMatrixContraction.lean"

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/cache@v5
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Install Lean
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          if ! command -v elan >/dev/null 2>&1; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Capture first error
        id: lean
        shell: bash
        run: |
          set +e
          bash scripts/check_changed_lean.sh origin/main > /tmp/lean.log 2>&1
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          grep -n -m 12 -B 4 -A 18 -E "error: .*\.lean:|failed to synthesize|type mismatch|application type mismatch|unknown identifier|invalid field|unsolved goals" /tmp/lean.log > /tmp/hilbert-errors.txt || true
          tail -n 120 /tmp/lean.log >> /tmp/hilbert-errors.txt
      - name: Save report
        if: steps.lean.outputs.status != '0'
        uses: actions/cache/save@v5
        with:
          path: /tmp/hilbert-errors.txt
          key: hilbert-error-${{ github.sha }}
      - name: Fail on Lean error
        if: steps.lean.outputs.status != '0'
        run: exit 1

  report:
    needs: diagnose
    if: always() && needs.diagnose.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v5
        with:
          path: /tmp/hilbert-errors.txt
          key: hilbert-error-${{ github.sha }}
          fail-on-cache-miss: true
      - run: cat /tmp/hilbert-errors.txt
