name: External Audit Readiness CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: external-audit-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  external-audit-readiness:
    name: Check external audit readiness gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cache elan and Lake build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake
          key: ${{ runner.os }}-external-audit-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-external-audit-
            ${{ runner.os }}-lean-fast-
            ${{ runner.os }}-lean-
      - name: Audit external audit readiness gate
        run: python3 scripts/audit_external_audit_readiness_gate.py
      - name: Audit external audit readiness gate field classification
        run: python3 scripts/audit_external_audit_readiness_gate_field_classification.py
      - name: Install elan and Lean toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          retry() {
            local n=0
            local max=5
            local delay=10
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge "$max" ]; then
                echo "[external-audit][retry] command failed after ${n} attempts: $*" >&2
                return 1
              fi
              echo "[external-audit][retry] command failed; retry ${n}/${max} after ${delay}s: $*" >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          }
          if ! command -v elan >/dev/null 2>&1; then
            retry bash -c 'curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none'
          else
            echo "[external-audit] using cached elan: $(command -v elan)"
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Show Lean and Lake versions
        shell: bash
        run: |
          set -euxo pipefail
          lean --version
          lake --version
      - name: Generate Lake manifest when needed
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -s lake-manifest.json ] || ! grep -q 'mathlib' lake-manifest.json; then
            lake update
          else
            echo "lake-manifest.json already contains mathlib; skipping lake update"
          fi
      - name: Hydrate Mathlib cache
        shell: bash
        run: |
          set -euxo pipefail
          lake exe cache get
      - name: Build external audit readiness gate
        shell: bash
        run: |
          set -euxo pipefail
          lake build MGAP4D.MathlibAnalytic.ExternalAuditReadinessGate
