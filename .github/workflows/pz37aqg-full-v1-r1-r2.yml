name: PZ37AQG full-cache sandbox v1 genuine reflected correlation
on:
  pull_request:
    paths:
      - "diagnostics/pz37aqg/full-v1-r1-r2/**"
      - ".github/workflows/pz37aqg-full-v1-r1-r2.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37aqg-full-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-aqg-full-v1.yml
    with:
      pack: diagnostics/pz37aqg/full-v1-r1-r2/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: da9cc0976de5fce6211666fd81009f18a6cb0dd5
