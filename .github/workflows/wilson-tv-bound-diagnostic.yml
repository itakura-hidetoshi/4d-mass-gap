name: Wilson TV Bound Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/wilson-tv-bound-diagnostic.yml"
      - "MGAP4D/MathlibAnalytic/FiniteLatticeWilsonConditionalTotalVariationBounds.lean"

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-fast-
      - name: Install elan
        run: |
          if ! command -v elan >/dev/null 2>&1; then
            curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build TV bound
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          lake build MGAP4D.MathlibAnalytic.FiniteLatticeWilsonConditionalTotalVariationBounds 2>&1 | tee wilson-tv-bound.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wilson-tv-bound-log
          path: wilson-tv-bound.log
      - name: Propagate failure
        if: steps.build.outcome == 'failure'
        run: exit 1
