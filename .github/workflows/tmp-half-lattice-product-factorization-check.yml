name: Temporary Half-Lattice Product Factorization Check

on:
  pull_request:

concurrency:
  group: temporary-half-lattice-product-factorization-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  half-lattice-product-factorization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build product factorization bridge
        shell: bash
        run: |
          set +e
          lake build MGAP4D.MathlibAnalytic.PhysicalYangMillsOrientedWilsonOSHalfLatticeProductFactorization > /tmp/half-lattice-product.log 2>&1
          status=$?
          echo "$status" > /tmp/half-lattice-product.status
          if [ "$status" -eq 0 ]; then
            echo "Half-lattice product factorization build passed" | tee /tmp/half-lattice-product-diagnostics.txt
          else
            {
              echo "Half-lattice product factorization build failed; compact diagnostics follow"
              grep -n -B 4 -A 22 'error:' /tmp/half-lattice-product.log || tail -n 180 /tmp/half-lattice-product.log
            } | tee /tmp/half-lattice-product-diagnostics.txt
          fi
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: half-lattice-product-factorization-diagnostics
          path: /tmp/half-lattice-product-diagnostics.txt
          if-no-files-found: error
      - name: Propagate build status
        if: always()
        shell: bash
        run: exit "$(cat /tmp/half-lattice-product.status)"
