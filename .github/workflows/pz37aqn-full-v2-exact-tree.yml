name: PZ37AQN full-cache sandbox v2 concrete centered four-link ray
on:
  pull_request:
    paths:
      - "diagnostics/pz37aqn/full-v2-exact-tree/**"
      - ".github/workflows/pz37aqn-full-v2-exact-tree.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37aqn-full-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-aqn-full-v2.yml
    with:
      pack: diagnostics/pz37aqn/full-v2-exact-tree/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: e72717fb1c5e12a7e49d3b19a1c243ffc24db540
