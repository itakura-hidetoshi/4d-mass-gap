name: Temporary Periodic SU(N) Boundary Haar Check

on:
  pull_request:

concurrency:
  group: temporary-periodic-su-boundary-haar-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  periodic-su-boundary-haar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build periodic SU(N) boundary Haar factorization
        shell: bash
        run: |
          set +e
          lake build MGAP4D.MathlibAnalytic.PeriodicHypercubicSpecialUnitaryBoundaryFiberedHaarFactorization > /tmp/periodic-su-boundary-haar.log 2>&1
          status=$?
          echo "$status" > /tmp/periodic-su-boundary-haar.status
          if [ "$status" -eq 0 ]; then
            echo "Periodic SU(N) boundary Haar factorization build passed" | tee /tmp/periodic-su-boundary-haar-diagnostics.txt
          else
            {
              echo "Periodic SU(N) boundary Haar factorization build failed; compact diagnostics follow"
              grep -n -B 4 -A 36 'error:' /tmp/periodic-su-boundary-haar.log || tail -n 300 /tmp/periodic-su-boundary-haar.log
            } | tee /tmp/periodic-su-boundary-haar-diagnostics.txt
          fi
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: periodic-su-boundary-haar-diagnostics
          path: /tmp/periodic-su-boundary-haar-diagnostics.txt
          if-no-files-found: error
      - name: Propagate build status
        if: always()
        shell: bash
        run: exit "$(cat /tmp/periodic-su-boundary-haar.status)"
