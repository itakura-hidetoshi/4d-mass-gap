name: Periodic Shift Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/periodic-shift-diagnostic.yml"
      - "MGAP4D/MathlibAnalytic/PeriodicHypercubicNondegenerateShifts.lean"

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-fast-
      - name: Install elan
        run: |
          if ! command -v elan >/dev/null 2>&1; then
            curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build nondegenerate shift target
        id: build
        shell: bash
        run: |
          set +e
          lake build MGAP4D.MathlibAnalytic.PeriodicHypercubicNondegenerateShifts > periodic-shift-full.log 2>&1
          code=$?
          tail -n 240 periodic-shift-full.log > periodic-shift-tail.log
          python3 scripts/lean_feedback_classifier.py --exit-code "$code" --pretty periodic-shift-full.log > periodic-shift-feedback.json
          cat periodic-shift-tail.log
          cat periodic-shift-feedback.json
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: periodic-shift-diagnostic
          path: |
            periodic-shift-tail.log
            periodic-shift-feedback.json
      - name: Propagate failure
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
