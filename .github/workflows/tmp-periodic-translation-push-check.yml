name: Temporary Periodic Translation Push Check

on:
  push:
    branches:
      - "physical-4d-yang-mills-measure-limit"
    paths:
      - ".github/workflows/tmp-periodic-translation-push-check.yml"
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "MGAP4D/MathlibAnalytic/PeriodicHypercubicTranslationInvariance.lean"
      - "MGAP4D/MathlibAnalytic/PeriodicHypercubicIntegerTemporalTranslation.lean"
      - "MGAP4D/MathlibAnalytic/PeriodicHypercubicSpecialUnitaryPhysicalTemporalAction.lean"
      - "MGAP4D/MathlibAnalytic/PhysicalYangMillsGaugeInvariantOSHamiltonianSpine.lean"

concurrency:
  group: tmp-periodic-translation-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"

jobs:
  targeted-check:
    name: Periodic translation push check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Cache elan toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-

      - name: Restore Lake build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-fast-lake-v4-
            ${{ runner.os }}-lean-fast-v3-
            ${{ runner.os }}-lean-fast-
            ${{ runner.os }}-lean-

      - name: Install elan and Lean toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if ! command -v elan >/dev/null 2>&1; then
            curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build periodic temporal Hamiltonian spine
        shell: bash
        run: |
          set -euxo pipefail
          lake build \
            MGAP4D.MathlibAnalytic.PeriodicHypercubicTranslationInvariance \
            MGAP4D.MathlibAnalytic.PeriodicHypercubicIntegerTemporalTranslation \
            MGAP4D.MathlibAnalytic.PeriodicHypercubicSpecialUnitaryPhysicalTemporalAction \
            MGAP4D.MathlibAnalytic.PhysicalYangMillsGaugeInvariantOSHamiltonianSpine
