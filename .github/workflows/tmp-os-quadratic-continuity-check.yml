name: Temporary OS Quadratic Continuity Check

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-os-quadratic-continuity-check.yml"
      - "MGAP4D/MathlibAnalytic/PhysicalYangMillsGaugeInvariantOSQuadraticStrongContinuity.lean"
      - "MGAP4D/MathlibAnalytic/PhysicalYangMillsGaugeInvariantOSDiscreteFloorQuadraticSelfAdjointness.lean"

permissions:
  contents: read

jobs:
  targeted-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache elan toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-

      - name: Restore Lake build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-fast-lake-v4-
            ${{ runner.os }}-lean-fast-v3-
            ${{ runner.os }}-lean-fast-
            ${{ runner.os }}-lean-

      - name: Install elan and Lean toolchain
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v elan >/dev/null 2>&1; then
            curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Prepare Mathlib cache
        shell: bash
        run: |
          set -euxo pipefail
          lean --version
          lake --version
          if [ ! -d ".lake/packages/mathlib/.lake/build/lib/lean/Mathlib" ]; then
            lake exe cache get || true
          fi

      - name: Build targeted module
        id: build
        shell: bash
        run: |
          set +e
          lake build \
            MGAP4D.MathlibAnalytic.PhysicalYangMillsGaugeInvariantOSDiscreteFloorQuadraticSelfAdjointness \
            > /tmp/os-quadratic-continuity.log 2>&1
          status=$?
          cat /tmp/os-quadratic-continuity.log
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-quadratic-continuity-log
          path: /tmp/os-quadratic-continuity.log
          if-no-files-found: error
          retention-days: 1

      - name: Propagate build result
        if: steps.build.outputs.status != '0'
        shell: bash
        run: exit 1
