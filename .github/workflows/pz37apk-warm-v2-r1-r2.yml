name: PZ37APK warm sandbox v2 exact OS boundary determinant
on:
  pull_request:
    paths:
      - "diagnostics/pz37apk/warm-v2-r1-r2/**"
      - ".github/workflows/pz37apk-warm-v2-r1-r2.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37apk-warm-v2-r1-r2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-v2.yml
    with:
      pack: diagnostics/pz37apk/warm-v2-r1-r2/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: ff78e740988ea77fccfc6bdd0a8bbf451806e19c
