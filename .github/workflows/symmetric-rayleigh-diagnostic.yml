name: Symmetric Rayleigh Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/symmetric-rayleigh-diagnostic.yml"
      - "MGAP4D/MathlibAnalytic/FiniteWilsonOSAutomaticExactGapSymmetricRayleighContraction.lean"

permissions:
  contents: read

concurrency:
  group: symmetric-rayleigh-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"
  LAKE_CACHE_REF_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/cache@v5
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-

      - uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ env.LAKE_CACHE_REF_SHA }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-fast-lake-v4-
            ${{ runner.os }}-lean-fast-v3-
            ${{ runner.os }}-lean-fast-
            ${{ runner.os }}-lean-

      - name: Install Lean
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if ! command -v elan >/dev/null 2>&1; then
            curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Capture first error
        shell: bash
        run: |
          set +e
          lake env lean -DautoImplicit=false \
            MGAP4D/MathlibAnalytic/FiniteWilsonOSAutomaticExactGapSymmetricRayleighContraction.lean \
            > /tmp/symmetric-rayleigh-full.log 2>&1
          status=$?
          echo "$status" > /tmp/symmetric-rayleigh-status.txt
          grep -n -B 8 -A 35 -E 'error:|Application type mismatch|unsolved goals|tactic.*failed|failed to synthesize' \
            /tmp/symmetric-rayleigh-full.log > /tmp/symmetric-rayleigh-errors.txt || \
            tail -n 160 /tmp/symmetric-rayleigh-full.log > /tmp/symmetric-rayleigh-errors.txt
          exit 0

      - name: Save report
        uses: actions/cache/save@v5
        with:
          path: |
            /tmp/symmetric-rayleigh-errors.txt
            /tmp/symmetric-rayleigh-status.txt
          key: symmetric-rayleigh-error-${{ github.event.pull_request.head.sha }}

      - name: Fail on Lean error
        shell: bash
        run: test "$(cat /tmp/symmetric-rayleigh-status.txt)" -eq 0

  report:
    if: always()
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v5
        with:
          path: |
            /tmp/symmetric-rayleigh-errors.txt
            /tmp/symmetric-rayleigh-status.txt
          key: symmetric-rayleigh-error-${{ github.event.pull_request.head.sha }}
          fail-on-cache-miss: true
      - run: cat /tmp/symmetric-rayleigh-errors.txt
