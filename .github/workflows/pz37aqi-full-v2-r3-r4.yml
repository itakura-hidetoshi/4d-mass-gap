name: PZ37AQI full-cache sandbox v2 finite connected Hankel correlation
on:
  pull_request:
    paths:
      - "diagnostics/pz37aqi/full-v2-r3-r4/**"
      - ".github/workflows/pz37aqi-full-v2-r3-r4.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37aqi-full-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-aqi-full-v2.yml
    with:
      pack: diagnostics/pz37aqi/full-v2-r3-r4/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: e154286a729c5864bbf00cb6fa5ec057bffbaf99
