name: Temporary OS Mass Gap Direct Diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/tmp-os-mass-gap-direct-diagnostic.yml"
      - "MGAP4D/MathlibAnalytic/PhysicalYangMillsGaugeInvariantOSQuadraticStrongContinuity.lean"
      - "MGAP4D/MathlibAnalytic/PhysicalYangMillsGaugeInvariantOSVacuumOrthogonalHamiltonian.lean"
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"

permissions:
  contents: read

concurrency:
  group: temporary-os-mass-gap-direct-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    strategy:
      fail-fast: false
      matrix:
        target:
          - MGAP4D.MathlibAnalytic.PhysicalYangMillsGaugeInvariantOSQuadraticStrongContinuity
          - MGAP4D.MathlibAnalytic.PhysicalYangMillsGaugeInvariantOSVacuumOrthogonalHamiltonian
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          build-args: --quiet ${{ matrix.target }}
