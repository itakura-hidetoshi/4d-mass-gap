name: PZ37APC warm sandbox v2 uniform normalized original row response
on:
  pull_request:
    paths:
      - "diagnostics/pz37apc/warm-v2/**"
      - ".github/workflows/pz37apc-warm-v2.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37apc-warm-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-v2.yml
    with:
      pack: diagnostics/pz37apc/warm-v2/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: 060ebb0b492b23593422d5c93a4aeb1258b8292a
