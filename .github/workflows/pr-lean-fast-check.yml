name: PR Lean Fast Check

on:
  pull_request:
    paths:
      - ".github/workflows/pr-lean-fast-check.yml"
      - "MGAP4D/**/*.lean"
      - "scripts/**/*.py"
      - "scripts/**/*.sh"

permissions:
  contents: read

jobs:
  pr-lean-fast-check:
    name: Changed Lean fast check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run OS/Wightman route audit
        id: route-audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/audit_os_wightman_mass_gap_bridge.py 2>&1 | tee route-audit.log

      - name: Upload route-audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-audit-log
          path: route-audit.log
          if-no-files-found: error

      - name: Propagate route-audit failure
        if: steps.route-audit.outcome == 'failure'
        shell: bash
        run: exit 1
