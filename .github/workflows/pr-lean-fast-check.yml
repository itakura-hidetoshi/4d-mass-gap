name: PR Lean Fast Check

on:
  pull_request:
    paths:
      - ".github/workflows/pr-lean-fast-check.yml"
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "MGAP4D/**/*.lean"
      - "scripts/**/*.py"
      - "scripts/**/*.sh"

concurrency:
  group: pr-lean-fast-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"
  CHECK_CHANGED_LEAN_BASE_REF: origin/main
  LAKE_CACHE_REF_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  pr-lean-fast-check:
    name: Changed Lean fast check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Cache elan toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-

      - name: Restore Lake build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ env.LAKE_CACHE_REF_SHA }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-fast-lake-v4-
            ${{ runner.os }}-lean-fast-v3-
            ${{ runner.os }}-lean-fast-

      - name: Install elan and Lean toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if ! command -v elan >/dev/null 2>&1; then
            curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lean --version
          lake --version

      - name: Run changed Lean diagnostic
        id: lean-check
        shell: bash
        run: |
          set +e
          bash scripts/check_changed_lean.sh "${CHECK_CHANGED_LEAN_BASE_REF}" > /tmp/lean.log 2>&1
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          {
            echo "=== first errors ==="
            grep -n -m 16 -B 4 -A 18 -E "error: .*\.lean:|failed to synthesize|type mismatch|application type mismatch|unknown identifier|invalid field|unsolved goals" /tmp/lean.log || true
            echo "=== tail ==="
            tail -n 160 /tmp/lean.log || true
          } > /tmp/lean-diagnostic.txt
          exit 0

      - name: Save diagnostic cache
        if: steps.lean-check.outputs.status != '0'
        uses: actions/cache/save@v5
        with:
          path: /tmp/lean-diagnostic.txt
          key: lean-diagnostic-${{ github.sha }}

      - name: Fail when Lean failed
        if: steps.lean-check.outputs.status != '0'
        shell: bash
        run: exit 1

  diagnostic-report:
    name: Lean diagnostic report
    needs: pr-lean-fast-check
    if: always() && needs.pr-lean-fast-check.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Restore diagnostic cache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/lean-diagnostic.txt
          key: lean-diagnostic-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Print diagnostic
        shell: bash
        run: cat /tmp/lean-diagnostic.txt
