name: PR Lean Fast Check

on:
  pull_request:
    paths:
      - ".github/workflows/pr-lean-fast-check.yml"
      - "MGAP4D/MathlibAnalytic/FiniteOrientedLatticeWilsonPlaquetteLocality.lean"

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"

jobs:
  pr-lean-fast-check:
    name: Changed Lean fast check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Restore Lake build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-fast-
      - name: Install elan
        run: |
          if ! command -v elan >/dev/null 2>&1; then
            curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build locality target
        shell: bash
        run: |
          set -o pipefail
          lake build MGAP4D.MathlibAnalytic.FiniteOrientedLatticeWilsonPlaquetteLocality 2>&1 | tail -n 300
