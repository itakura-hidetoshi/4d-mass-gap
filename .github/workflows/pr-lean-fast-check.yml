name: PR Lean Fast Check

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base ref passed to scripts/check_changed_lean.sh"
        required: false
        default: "origin/main"
        type: string
  pull_request:
    branches:
      - main
      - mathlib-l2-finite-synthesis-range-template
      - mathlib-l2-r2-graph-submodule-frontier
    paths:
      - ".github/workflows/pr-lean-fast-check.yml"
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "MGAP4D/**/*.lean"
      - "scripts/**/*.py"
      - "scripts/**/*.sh"

concurrency:
  group: pr-lean-fast-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MATHLIB_NO_CACHE_ON_UPDATE: "1"
  CHECK_CHANGED_LEAN_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.inputs.base_ref || 'origin/main' }}

jobs:
  pr-lean-fast-check:
    name: Changed Lean fast check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache elan, Lake build artifacts, and generated manifest
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-v3-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-v3-
            ${{ runner.os }}-lean-fast-
            ${{ runner.os }}-lean-
      - name: Install elan and Lean toolchain
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v elan >/dev/null 2>&1; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Show Lean and Lake versions
        shell: bash
        run: |
          set -euxo pipefail
          lean --version
          lake --version
      - name: Run changed Lean fast check
        shell: bash
        run: |
          set -euxo pipefail
          echo "[fast] CHECK_CHANGED_LEAN_BASE_REF=${CHECK_CHANGED_LEAN_BASE_REF}"
          bash scripts/check_changed_lean.sh "${CHECK_CHANGED_LEAN_BASE_REF}"
