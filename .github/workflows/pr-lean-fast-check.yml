name: PR Lean Fast Check

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base ref passed to scripts/check_changed_lean.sh"
        required: false
        default: "origin/main"
        type: string
  pull_request:
    paths:
      - ".github/workflows/pr-lean-fast-check.yml"
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "MGAP4D/**/*.lean"
      - "scripts/**/*.py"
      - "scripts/**/*.sh"
  push:
    branches:
      - main
      - formal/real-hilbert-uniform-coercive-strong-limit
    paths:
      - ".github/workflows/pr-lean-fast-check.yml"
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "MGAP4D/**/*.lean"
      - "scripts/**/*.py"
      - "scripts/**/*.sh"

concurrency:
  group: pr-lean-fast-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"
  CHECK_CHANGED_LEAN_BASE_REF: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'workflow_dispatch' && inputs.base_ref || github.event.pull_request.base.sha }}
  LAKE_CACHE_REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

jobs:
  pr-lean-fast-check:
    name: Changed Lean fast check
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false

      - name: Preflight changed Lean static audit
        shell: bash
        run: |
          set -euxo pipefail
          echo "[preflight] CHECK_CHANGED_LEAN_BASE_REF=${CHECK_CHANGED_LEAN_BASE_REF}"
          bash scripts/audit_changed_lean_preflight.sh "${CHECK_CHANGED_LEAN_BASE_REF}"

      - name: Detect whether Lake is required
        id: lake-mode
        shell: bash
        run: |
          set -euo pipefail
          changed_file_list="${RUNNER_TEMP}/pr-lean-fast-check-changed-files.txt"
          if ! git diff --name-only "${CHECK_CHANGED_LEAN_BASE_REF}"...HEAD > "${changed_file_list}"; then
            echo "[fast] base ${CHECK_CHANGED_LEAN_BASE_REF} unavailable; using HEAD^"
            git diff --name-only HEAD^ HEAD > "${changed_file_list}"
          fi

          echo "[fast] changed files used for Lake decision:"
          cat "${changed_file_list}"

          required=false
          while IFS= read -r changed_path; do
            case "${changed_path}" in
              MGAP4D/*.lean)
                if [ "${changed_path}" != "MGAP4D/MathlibAnalytic.lean" ]; then
                  required=true
                  break
                fi
                ;;
            esac
          done < "${changed_file_list}"
          if grep -Eq '^(lean-toolchain|lakefile\.lean|lake-manifest\.json)$' "${changed_file_list}"; then
            required=true
          fi
          if grep -qx 'scripts/audit_os_wightman_mass_gap_bridge.py' "${changed_file_list}"; then
            required=true
          fi

          echo "required=${required}" >> "${GITHUB_OUTPUT}"
          echo "[fast] Lake required: ${required}"

      - name: Run static-only changed check
        if: ${{ steps.lake-mode.outputs.required != 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          echo "[fast] no changed Lean leaf or toolchain target; skipping Lake cache and toolchain"
          bash scripts/check_changed_lean.sh "${CHECK_CHANGED_LEAN_BASE_REF}"

      - name: Cache elan toolchain
        if: ${{ steps.lake-mode.outputs.required == 'true' }}
        uses: actions/cache@v5
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-

      - name: Restore Lake build cache
        if: ${{ steps.lake-mode.outputs.required == 'true' }}
        id: lake-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ env.LAKE_CACHE_REF_SHA }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-fast-lake-v4-
            ${{ runner.os }}-lean-fast-v3-
            ${{ runner.os }}-lean-fast-
            ${{ runner.os }}-lean-

      - name: Install elan and Lean toolchain
        if: ${{ steps.lake-mode.outputs.required == 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          retry() {
            local n=0
            local max=5
            local delay=10
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge "$max" ]; then
                echo "[fast][retry] command failed after ${n} attempts: $*" >&2
                return 1
              fi
              echo "[fast][retry] command failed; retry ${n}/${max} after ${delay}s: $*" >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          }
          if ! command -v elan >/dev/null 2>&1; then
            retry bash -c 'curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none'
          else
            echo "[fast] using cached elan: $(command -v elan)"
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show Lean and Lake versions
        if: ${{ steps.lake-mode.outputs.required == 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          retry() {
            local n=0
            local max=5
            local delay=10
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge "$max" ]; then
                echo "[fast][retry] command failed after ${n} attempts: $*" >&2
                return 1
              fi
              echo "[fast][retry] command failed; retry ${n}/${max} after ${delay}s: $*" >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          }
          retry lean --version
          retry lake --version
          echo "[fast] lake-cache-hit=${{ steps.lake-cache.outputs.cache-hit }}"
          echo "[fast] lake-cache-ref-sha=${LAKE_CACHE_REF_SHA}"

      - name: Run changed Lean fast check
        if: ${{ steps.lake-mode.outputs.required == 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          echo "[fast] CHECK_CHANGED_LEAN_BASE_REF=${CHECK_CHANGED_LEAN_BASE_REF}"
          bash scripts/check_changed_lean.sh "${CHECK_CHANGED_LEAN_BASE_REF}" 2>&1 | tee "${RUNNER_TEMP}/lean-fast.log"

      - name: Upload Lean fast-check diagnostics
        if: ${{ always() && steps.lake-mode.outputs.required == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: lean-fast-check-log
          path: ${{ runner.temp }}/lean-fast.log
          if-no-files-found: warn

      - name: Check Lake cache is saveable
        if: ${{ steps.lake-mode.outputs.required == 'true' }}
        id: lake-cache-ready
        shell: bash
        run: |
          if [ -d ".lake/packages/mathlib/.lake/build/lib/lean/Mathlib" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Lake build cache from trusted branches
        if: ${{ steps.lake-mode.outputs.required == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/formal/real-hilbert-uniform-coercive-strong-limit') && steps.lake-cache.outputs.cache-hit != 'true' && steps.lake-cache-ready.outputs.ready == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.sha }}

  chatgpt-completion-dispatch:
    name: Emit secondary CI completion dispatch
    needs: pr-lean-fast-check
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Dispatch exact source-run identity
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_WORKFLOW: PR Lean Fast Check
        run: |
          set -uo pipefail
          request_body="${RUNNER_TEMP}/chatgpt-ci-completion-dispatch.json"
          response_body="${RUNNER_TEMP}/chatgpt-ci-completion-dispatch-response.txt"
          python3 - "${request_body}" <<'PY'
          import json
          import os
          import pathlib
          import sys

          body = {
              "event_type": "chatgpt_ci_completion_dispatch_v0_1",
              "client_payload": {
                  "repository": os.environ["REPOSITORY"],
                  "pull_request": int(os.environ["PR_NUMBER"]),
                  "run_id": int(os.environ["SOURCE_RUN_ID"]),
                  "run_attempt": int(os.environ["SOURCE_RUN_ATTEMPT"]),
                  "head_sha": os.environ["SOURCE_HEAD_SHA"],
                  "head_branch": os.environ["SOURCE_HEAD_BRANCH"],
                  "workflow": os.environ["SOURCE_WORKFLOW"],
              },
          }
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(body, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

          http_code="$(curl \
            --silent \
            --show-error \
            --output "${response_body}" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data-binary "@${request_body}" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/dispatches" || true)"
          if [ -z "${http_code}" ]; then
            http_code="000"
          fi
          echo "http_code=${http_code}" >> "${GITHUB_OUTPUT}"
          if [ "${http_code}" != "204" ]; then
            echo "::warning::secondary ChatGPT CI completion dispatch failed with HTTP ${http_code}"
            cat "${response_body}" || true
          fi
          exit 0

      - name: Publish dispatch summary
        if: always()
        run: |
          {
            echo '## Secondary ChatGPT CI completion dispatch'
            echo
            echo '- Event type: `chatgpt_ci_completion_dispatch_v0_1`'
            echo '- Source workflow: `PR Lean Fast Check`'
            echo '- Source run: `${{ github.run_id }}` attempt `${{ github.run_attempt }}`'
            echo '- Exact PR head: `${{ github.event.pull_request.head.sha }}`'
            echo '- Dispatch HTTP status: `${{ steps.dispatch.outputs.http_code || 'unknown' }}`'
            echo '- Dispatch is a wake-up request only and grants no CI truth or merge/write authority.'
          } >> "${GITHUB_STEP_SUMMARY}"
