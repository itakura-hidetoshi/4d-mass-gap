name: PR Lean Fast Check

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base ref passed to scripts/check_changed_lean.sh"
        required: false
        default: "origin/main"
        type: string
  pull_request:
    paths:
      - ".github/workflows/pr-lean-fast-check.yml"
      - ".github/lean-cache-version"
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "MGAP4D/**/*.lean"
      - "scripts/**/*.py"
      - "scripts/**/*.sh"
  push:
    branches:
      - main
      - formal/real-hilbert-uniform-coercive-strong-limit
    paths:
      - ".github/workflows/pr-lean-fast-check.yml"
      - ".github/lean-cache-version"
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "MGAP4D/**/*.lean"
      - "scripts/**/*.py"
      - "scripts/**/*.sh"

concurrency:
  group: pr-lean-fast-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"
  CHECK_CHANGED_LEAN_BASE_REF: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'workflow_dispatch' && inputs.base_ref || github.event.pull_request.base.sha }}
  # Dependency artifacts are keyed only by the pinned Lean/Lake/manifest inputs.
  # A stable cache per (PR, exact base HEAD) avoids a 1.1 GB archive per proof edit.
  # Lake trace/fingerprint checking still rebuilds the changed proof and imports.
  LAKE_BASE_CACHE_REF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
  LAKE_PROJECT_CACHE_REF: ${{ github.event_name == 'pull_request' && format('pr-{0}-base-{1}', github.event.pull_request.number, github.event.pull_request.base.sha) || format('base-{0}', github.sha) }}
  # Lake remains the authoritative dependency-aware checker. Disable the
  # duplicate direct `lean` pass in GitHub CI; local runs keep it by default.
  LEAN_FAST_DIRECT_ELAB: "false"

jobs:
  certified-leaf-relay:
    name: Relay independently certified Lean leaf outputs
    if: github.event_name == 'push' && github.ref == 'refs/heads/formal/real-hilbert-uniform-coercive-strong-limit'
    # Any failed/missing relay evidence invokes the unchanged build on a
    # separate clean runner. This job never elevates a cache to proof authority.
    continue-on-error: true
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      reused: ${{ steps.done.outputs.reused }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Bind exact successful independent PR and verified leaf delta
        id: bind
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/lean_certified_merge_relay_v1.py prepare --output "$RUNNER_TEMP/leaf-relay-v1"
      - name: Restore exact Lean
        if: steps.bind.outputs.eligible == 'true'
        id: elan
        uses: actions/cache/restore@v5
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
      - name: Restore exact mathlib
        if: steps.bind.outputs.eligible == 'true'
        id: deps
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lean-fast-deps-v1-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}
      - name: Restore exact predecessor full cache
        if: steps.bind.outputs.eligible == 'true'
        id: base
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: ${{ runner.os }}-lean-fast-project-v1-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-base-${{ steps.bind.outputs.base }}
      - name: Verify delta and no-build imports without re-elaboration
        if: steps.bind.outputs.eligible == 'true'
        id: verify
        env:
          ELAN: ${{ steps.elan.outputs.cache-hit }}
          DEPS: ${{ steps.deps.outputs.cache-hit }}
          BASE: ${{ steps.base.outputs.cache-hit }}
        run: |
          set -euo pipefail
          [[ "$ELAN" == true && "$DEPS" == true && "$BASE" == true ]]
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          python3 scripts/lean_certified_merge_relay_v1.py apply --output "$RUNNER_TEMP/leaf-relay-v1"
      - name: Publish exact merged full cache without a second Lean build
        if: steps.bind.outputs.eligible == 'true' && steps.verify.outcome == 'success'
        id: save
        uses: actions/cache/save@v5
        with:
          path: .lake/build
          key: ${{ runner.os }}-lean-fast-project-v1-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-base-${{ github.sha }}
      - name: Confirm exact merged cache is visible
        if: steps.bind.outputs.eligible == 'true' && steps.verify.outcome == 'success' && steps.save.outcome == 'success'
        id: visible
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          lookup-only: true
          key: ${{ runner.os }}-lean-fast-project-v1-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-base-${{ github.sha }}
      - name: Publish exact merge reuse outcome
        if: steps.bind.outputs.eligible == 'true' && steps.verify.outcome == 'success' && steps.save.outcome == 'success' && steps.visible.outputs.cache-hit == 'true'
        id: done
        run: echo "reused=true" >> "$GITHUB_OUTPUT"
      - name: Archive relay receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lean-certified-merge-relay-v1-receipt
          path: |
            ${{ runner.temp }}/leaf-relay-v1/verified-receipt.json
            ${{ runner.temp }}/leaf-relay-v1/published-receipt.json
          if-no-files-found: ignore
          retention-days: 30

  pr-lean-fast-check:
    name: Changed Lean fast check
    needs: certified-leaf-relay
    if: ${{ always() && !cancelled() && needs.certified-leaf-relay.outputs.reused != 'true' }}
    runs-on: ubuntu-22.04
    # Foundational incidence lemmas invalidate thousands of dependent oleans.
    # Exact-head PZ37O runs exceeded 60 minutes with no Lean errors, so allow
    # a complete dependency-aware check; do not skip imports or lower heartbeats.
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false

      - name: Preflight changed Lean static audit
        shell: bash
        run: |
          set -euxo pipefail
          echo "[preflight] CHECK_CHANGED_LEAN_BASE_REF=${CHECK_CHANGED_LEAN_BASE_REF}"
          bash scripts/audit_changed_lean_preflight.sh "${CHECK_CHANGED_LEAN_BASE_REF}"

      - name: Test changed-Lean dependency routing
        shell: bash
        run: |
          python3 scripts/test_changed_lean_dependency_check.py
          python3 scripts/test_lean_direct_diagnostic_routing.py
          python3 scripts/test_lean_certified_merge_relay_v1.py

      - name: Detect whether Lake is required
        id: lake-mode
        shell: bash
        run: |
          set -euo pipefail
          changed_file_list="${RUNNER_TEMP}/pr-lean-fast-check-changed-files.txt"
          if ! git diff --name-only "${CHECK_CHANGED_LEAN_BASE_REF}"...HEAD > "${changed_file_list}"; then
            echo "[fast] base ${CHECK_CHANGED_LEAN_BASE_REF} unavailable; using HEAD^"
            git diff --name-only HEAD^ HEAD > "${changed_file_list}"
          fi

          echo "[fast] changed files used for Lake decision:"
          cat "${changed_file_list}"

          required=false
          while IFS= read -r changed_path; do
            case "${changed_path}" in
              MGAP4D/*.lean)
                if [ "${changed_path}" != "MGAP4D/MathlibAnalytic.lean" ]; then
                  required=true
                  break
                fi
                ;;
            esac
          done < "${changed_file_list}"
          if grep -Eq '^(lean-toolchain|lakefile\.lean|lake-manifest\.json)$' "${changed_file_list}"; then
            required=true
          fi
          if grep -qx '.github/lean-cache-version' "${changed_file_list}"; then
            required=true
            echo "cache-warm=true" >> "${GITHUB_OUTPUT}"
          else
            echo "cache-warm=false" >> "${GITHUB_OUTPUT}"
          fi
          if grep -qx 'scripts/audit_os_wightman_mass_gap_bridge.py' "${changed_file_list}"; then
            required=true
          fi

          echo "required=${required}" >> "${GITHUB_OUTPUT}"
          echo "[fast] Lake required: ${required}"

      - name: Run static-only changed check
        if: ${{ steps.lake-mode.outputs.required != 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          echo "[fast] no changed Lean leaf or toolchain target; skipping Lake cache and toolchain"
          bash scripts/check_changed_lean.sh "${CHECK_CHANGED_LEAN_BASE_REF}"

      - name: Cache elan toolchain
        if: ${{ steps.lake-mode.outputs.required == 'true' }}
        uses: actions/cache@v5
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-

      - name: Restore pinned Lean dependency cache
        if: ${{ steps.lake-mode.outputs.required == 'true' }}
        id: lake-deps-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lean-fast-deps-v1-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}

      - name: Restore MGAP4D project olean cache
        if: ${{ steps.lake-mode.outputs.required == 'true' }}
        id: lake-project-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: ${{ runner.os }}-lean-fast-project-v1-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ env.LAKE_PROJECT_CACHE_REF }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-project-v1-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-pr-${{ github.event.pull_request.number }}-
            ${{ runner.os }}-lean-fast-project-v1-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-base-${{ env.LAKE_BASE_CACHE_REF_SHA }}
            ${{ runner.os }}-lean-fast-project-v1-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-base-

      # Read the old large archive only while migrating to split caches.
      - name: Restore legacy monolithic Lake cache for migration
        if: ${{ steps.lake-mode.outputs.required == 'true' && steps.lake-deps-cache.outputs.cache-hit != 'true' }}
        id: lake-legacy-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ env.LAKE_BASE_CACHE_REF_SHA }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-fast-lake-v4-
            ${{ runner.os }}-lean-fast-v3-
            ${{ runner.os }}-lean-fast-
            ${{ runner.os }}-lean-

      - name: Restore the exact checkout's pinned manifest
        if: ${{ steps.lake-mode.outputs.required == 'true' }}
        shell: bash
        run: git restore --source=HEAD -- lake-manifest.json

      - name: Install elan and Lean toolchain
        if: ${{ steps.lake-mode.outputs.required == 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          retry() {
            local n=0
            local max=5
            local delay=10
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge "$max" ]; then
                echo "[fast][retry] command failed after ${n} attempts: $*" >&2
                return 1
              fi
              echo "[fast][retry] command failed; retry ${n}/${max} after ${delay}s: $*" >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          }
          if ! command -v elan >/dev/null 2>&1; then
            retry bash -c 'curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none'
          else
            echo "[fast] using cached elan: $(command -v elan)"
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show Lean and Lake versions
        if: ${{ steps.lake-mode.outputs.required == 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          retry() {
            local n=0
            local max=5
            local delay=10
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge "$max" ]; then
                echo "[fast][retry] command failed after ${n} attempts: $*" >&2
                return 1
              fi
              echo "[fast][retry] command failed; retry ${n}/${max} after ${delay}s: $*" >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          }
          retry lean --version
          retry lake --version
          echo "[fast] lake-deps-cache-hit=${{ steps.lake-deps-cache.outputs.cache-hit }}"
          echo "[fast] lake-project-cache-hit=${{ steps.lake-project-cache.outputs.cache-hit }}"
          echo "[fast] lake-project-cache-matched-key=${{ steps.lake-project-cache.outputs.cache-matched-key }}"
          echo "[fast] lake-base-cache-ref-sha=${LAKE_BASE_CACHE_REF_SHA}"
          echo "[fast] lake-project-cache-ref=${LAKE_PROJECT_CACHE_REF}"

      # Cache hits do not guarantee the full physical import graph is covered.
      - name: Report restored project oleans and runner memory
        if: ${{ steps.lake-mode.outputs.required == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for dir in .lake/build/lib/lean/MGAP4D .lake/packages/mathlib/.lake/build/lib/lean/Mathlib; do
            if [ -d "$dir" ]; then
              count="$(find "$dir" -name '*.olean' -type f | wc -l | tr -d '[:space:]')"
              echo "[cache-audit] $dir: $count oleans"
            else
              echo "[cache-audit] $dir: missing"
            fi
          done
          echo "[cache-audit] project-cache-exact-hit=${{ steps.lake-project-cache.outputs.cache-hit }}"
          echo "[cache-audit] project-cache-matched-key=${{ steps.lake-project-cache.outputs.cache-matched-key }}"
          echo "[cache-audit] runner-cpus=$(nproc)"
          free -h
          df -h .
          du -sh .lake/build .lake/packages/mathlib/.lake/build 2>/dev/null || true

      - name: Warm pinned dependency cache
        if: ${{ steps.lake-mode.outputs.required == 'true' && steps.lake-mode.outputs.cache-warm == 'true' && steps.lake-deps-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -d ".lake/packages/mathlib/.lake/build/lib/lean/Mathlib" ]; then
            lake exe cache get
          else
            echo "[fast] restored Mathlib build cache is already present"
          fi

      # Direct diagnostics use restored oleans and are opt-in. The mandatory
      # Lake check below rebuilds dependencies before validating changed proofs.
      # Early, fully kernel-checked diagnostic for the two finite incidence
      # lemmas changed by PZ37O. This is NOT a substitute for the Lake check.
      - name: Kernel-check changed finite incidence geometry
        if: ${{ steps.lake-mode.outputs.required == 'true' && env.LEAN_FAST_DIRECT_ELAB == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          incidence='MGAP4D/MathlibAnalytic/PeriodicHypercubicPlaquetteIncidence.lean'
          if git diff --name-only "${CHECK_CHANGED_LEAN_BASE_REF}"...HEAD | grep -Fxq "${incidence}"; then
            prereq='.lake/build/lib/lean/MGAP4D/MathlibAnalytic/PeriodicHypercubicSignedGeometry.olean'
            if [[ -f "${prereq}" ]]; then
              echo "[fast] kernel-check finite incidence geometry before expensive downstream build"
              lake env lean -DautoImplicit=false "${incidence}"
            else
              echo "[fast] prerequisite olean not cached: Lake will check incidence with rebuilt imports"
            fi
          fi

      # Cheap syntax/type diagnostics for new PZ37O leaf modules. A direct
      # Lean invocation cannot replace Lake's dependency fingerprint validation.
      # Compile in import order against the restored baseline oleans, then
      # perform the full authoritative Lake build below.
      - name: Early elaboration of new PZ37O leaves
        if: ${{ steps.lake-mode.outputs.required == 'true' && env.LEAN_FAST_DIRECT_ELAB == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          base='.lake/build/lib/lean/MGAP4D/MathlibAnalytic'
          for prereq in \
            PhysicalYangMillsWilsonSU2ThreeModeKrylovAdjacentPairHaarOriginalRotationalBoundaryWitnessV5_PZ37N \
            PhysicalYangMillsWilsonSU2ThreeModeKrylovAdjacentPairHaarOriginalWilsonRawTwoSlabLiteralKernelV5_PJ \
            PhysicalYangMillsWilsonSU2ThreeModeKrylovAdjacentPairHaarOriginalWilsonThirdMomentPosteriorMassCriterionV5_PE \
            PhysicalYangMillsWilsonSU2ThreeModeKrylovAdjacentPairHaarOriginalWilsonPhysicalKrylovHankelMomentsV5_PB \
            PhysicalYangMillsWilsonSU2ThreeModeKrylovAdjacentPairHaarOriginalGramPhysicalRank; do
            if [[ ! -f "${base}/${prereq}.olean" ]]; then
              echo "[fast] no baseline olean for ${prereq}; skip early elaboration"
              exit 0
            fi
          done
          for mod in \
            PhysicalYangMillsWilsonSU2ThreeModeKrylovAdjacentPairHaarOriginalLiteralMinorThirdGapV5_PZ37O \
            PhysicalYangMillsWilsonSU2ThreeModeKrylovAdjacentPairHaarOriginalThirdRankPosteriorBridgeV5_PZ37O \
            PhysicalYangMillsWilsonSU2ThreeModeKrylovAdjacentPairHaarOriginalThirdMomentNonzeroBridgeV5_PZ37O \
            PhysicalYangMillsWilsonSU2ThreeModeKrylovAdjacentPairHaarOriginalPhysicalKrylovRankThreeV5_PZ37O; do
            src="MGAP4D/MathlibAnalytic/${mod}.lean"
            if [[ -f "${src}" ]]; then
              echo "[fast] diagnostic Lean elaboration: ${src}"
              lake env lean -DautoImplicit=false -o "${base}/${mod}.olean" "${src}"
            fi
          done
          echo "[fast] PZ37O diagnostic passed; authoritative Lake build follows"

      - name: Run changed Lean fast check
        if: ${{ steps.lake-mode.outputs.required == 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          echo "[fast] CHECK_CHANGED_LEAN_BASE_REF=${CHECK_CHANGED_LEAN_BASE_REF}"
          bash scripts/check_changed_lean.sh "${CHECK_CHANGED_LEAN_BASE_REF}" 2>&1 | tee "${RUNNER_TEMP}/lean-fast.log"

      - name: Upload Lean fast-check diagnostics
        if: ${{ always() && steps.lake-mode.outputs.required == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: lean-fast-check-log
          path: ${{ runner.temp }}/lean-fast.log
          if-no-files-found: warn

      - name: Prepare independently checked added-leaf delta
        if: ${{ success() && steps.lake-mode.outputs.required == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'formal/real-hilbert-uniform-coercive-strong-limit' }}
        id: leaf-delta
        continue-on-error: true
        run: python3 scripts/lean_certified_merge_relay_v1.py produce --log "$RUNNER_TEMP/lean-fast.log" --output "$RUNNER_TEMP/leaf-delta-v1"

      - name: Publish certified added-leaf delta
        if: steps.leaf-delta.outputs.eligible == 'true'
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: lean-certified-leaf-delta-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/leaf-delta-v1
          if-no-files-found: error
          retention-days: 14

      - name: Check Lake cache is saveable
        if: ${{ always() && !cancelled() && steps.lake-mode.outputs.required == 'true' }}
        id: lake-cache-ready
        shell: bash
        run: |
          if [ -d ".lake/packages/mathlib/.lake/build/lib/lean/Mathlib" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -d ".lake/build/lib/lean/MGAP4D" ]; then
            echo "project-ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "project-ready=false" >> "$GITHUB_OUTPUT"
          fi

      # Dependencies are immutable under the pinned manifest, so publish them
      # once per dependency hash. Project oleans are smaller and evolve
      # independently with PR heads / canonical branch SHAs.
      - name: Save pinned Lean dependency cache
        if: ${{ always() && !cancelled() && steps.lake-mode.outputs.required == 'true' && steps.lake-deps-cache.outputs.cache-hit != 'true' && steps.lake-cache-ready.outputs.ready == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .lake/packages
          key: ${{ steps.lake-deps-cache.outputs.cache-primary-key }}

      - name: Save MGAP4D project olean cache for same-repository PR retries
        if: ${{ always() && !cancelled() && steps.lake-mode.outputs.required == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.lake-project-cache.outputs.cache-hit != 'true' && steps.lake-cache-ready.outputs.project-ready == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .lake/build
          key: ${{ steps.lake-project-cache.outputs.cache-primary-key }}

      - name: Save MGAP4D project olean cache from trusted branches
        if: ${{ steps.lake-mode.outputs.required == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/formal/real-hilbert-uniform-coercive-strong-limit') && steps.lake-project-cache.outputs.cache-hit != 'true' && steps.lake-cache-ready.outputs.project-ready == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .lake/build
          key: ${{ steps.lake-project-cache.outputs.cache-primary-key }}


  # Each complete PR .lake/build archive costs ~1.1 GB. Keep only the latest
  # exact-head archive for this same PR to reduce GitHub's cache eviction.
  # No dependency, canonical baseline, or other PR cache is ever deleted.
  # Limit actions:write to a separate, same-repository-only maintenance job.
  retain-current-pr-project-cache:
    name: Retain latest same-PR project oleans
    needs: pr-lean-fast-check
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Inspect and prune only obsolete MGAP4D project caches of this PR
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const ref = 'refs/pull/' + pr + '/merge';
            const baseSha = context.payload.pull_request.base.sha;
            const expected = '-pr-' + pr + '-base-' + baseSha;
            const all = [];
            for (let page = 1; page <= 30; page++) {
              const r = await github.rest.actions.getActionsCacheList({
                owner, repo, ref, page, per_page: 100,
                sort: 'created_at', direction: 'desc'
              });
              const items = r.data.actions_caches || [];
              all.push(...items);
              if (items.length < 100) break;
            }
            const project = all.filter(c =>
              c.ref === ref && typeof c.key === 'string' &&
              c.key.includes('-lean-fast-project-v1-') &&
              c.key.includes('-pr-' + pr + '-')
            ).sort((a, b) =>
              Date.parse(b.created_at) - Date.parse(a.created_at)
            );
            const bytes = project.reduce((n, c) => n + c.size_in_bytes, 0);
            core.info('[cache-gc] own-pr=' + pr + ' project-archives=' +
              project.length + ' bytes=' + bytes);
            const newest = project.find(c => c.key.endsWith(expected));
            // The cache list may lag the save. Keep every old archive until
            // a complete current-base archive for this PR is visible.
            if (!newest || !newest.key.endsWith(expected)) {
              core.info('[cache-gc] current exact-head archive not visible; no deletion');
              return;
            }
            for (const stale of project.filter(c => c.id !== newest.id)) {
              core.info('[cache-gc] delete only prior same-PR project id=' +
                stale.id + ' bytes=' + stale.size_in_bytes);
              await github.rest.actions.deleteActionsCacheById({
                owner, repo, cache_id: stale.id
              });
            }
            core.info('[cache-gc] retained shared PR/base archive id=' + newest.id + ' base=' + baseSha);

  chatgpt-ci-status-receipt:
    name: Publish MCP CI completion receipt
    needs: [pr-lean-fast-check, certified-leaf-relay]
    # PR-head and trusted push merge-commit receipts both need exact-SHA statuses.
    # MCP's workflow-run lookup only returns pull_request-triggered executions.
    if: ${{ always() && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/formal/real-hilbert-uniform-coercive-strong-limit'))) }}
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Publish exact-head commit status receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          SOURCE_RESULT: ${{ needs.certified-leaf-relay.outputs.reused == 'true' && 'success' || needs.pr-lean-fast-check.result }}
          SOURCE_KIND: ${{ needs.certified-leaf-relay.outputs.reused == 'true' && 'certified-pr-relay-no-rebuild' || 'legacy-check-job' }}
          SOURCE_EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "[mcp-receipt] event=${SOURCE_EVENT} exact_sha=${HEAD_SHA} source_result=${SOURCE_RESULT} source_kind=${SOURCE_KIND} run=${RUN_ID} attempt=${RUN_ATTEMPT}"
          if [[ ! "${HEAD_SHA}" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo "[mcp-receipt] invalid exact commit SHA" >&2
            exit 1
          fi
          case "${SOURCE_RESULT}" in
            success)
              state="success"
              ;;
            failure|cancelled)
              state="failure"
              ;;
            *)
              state="error"
              ;;
          esac
          export STATUS_STATE="${state}"

          payload="${RUNNER_TEMP}/chatgpt-ci-status-receipt.json"
          python3 - "${payload}" <<'PY'
          import json
          import os
          import pathlib
          import sys

          body = {
              "state": os.environ["STATUS_STATE"],
              "target_url": os.environ["RUN_URL"],
              "description": (
                  "wake-up receipt only; "
                  f"run {os.environ['RUN_ID']} attempt {os.environ['RUN_ATTEMPT']}: "
                  f"{os.environ['SOURCE_RESULT']} {os.environ['SOURCE_KIND']}"
              )[:140],
              "context": "chatgpt-ci-receipt/PR Lean Fast Check",
          }
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(body, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

          # Expose the same status on PR heads and trusted branch push SHAs.
          # MCP get_commit_combined_status can read it on both kinds of commits.
          curl --fail-with-body --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 30 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data-binary "@${payload}" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/statuses/${HEAD_SHA}"
