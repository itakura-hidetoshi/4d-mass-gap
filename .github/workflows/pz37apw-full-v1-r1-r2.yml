name: PZ37APW full-cache sandbox v1 R1/R2 original time-one open-half realization
on:
  pull_request:
    paths:
      - "diagnostics/pz37apw/full-v1-r1-r2/**"
      - ".github/workflows/pz37apw-full-v1-r1-r2.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37apw-full-v1-r1-r2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-diagnostic-full-v1.yml
    with:
      pack: diagnostics/pz37apw/full-v1-r1-r2/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: 9a5fcedfeda91b85cc55a6db50871a01d8376234
