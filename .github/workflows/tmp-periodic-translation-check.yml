name: Temporary Periodic Translation Check

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-periodic-translation-check.yml"
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "MGAP4D/MathlibAnalytic/PeriodicHypercubicSignedGeometry.lean"
      - "MGAP4D/MathlibAnalytic/PeriodicHypercubicSpecialUnitaryWilsonSystem.lean"
      - "MGAP4D/MathlibAnalytic/PeriodicHypercubicTranslationInvariance.lean"
      - "MGAP4D/MathlibAnalytic/PeriodicHypercubicIntegerTemporalTranslation.lean"
      - "MGAP4D/MathlibAnalytic/PhysicalYangMillsOrientedTemporalSymmetryLimit.lean"
      - "MGAP4D/MathlibAnalytic/PeriodicHypercubicSpecialUnitaryPhysicalTemporalAction.lean"

concurrency:
  group: tmp-periodic-translation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"
  LAKE_CACHE_REF_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  targeted-check:
    name: Periodic translation targeted check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Cache elan toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-

      - name: Restore Lake build cache
        id: lake-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ env.LAKE_CACHE_REF_SHA }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-fast-lake-v4-
            ${{ runner.os }}-lean-fast-v3-
            ${{ runner.os }}-lean-fast-
            ${{ runner.os }}-lean-

      - name: Install elan and Lean toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          retry() {
            local n=0
            local max=5
            local delay=10
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge "$max" ]; then
                return 1
              fi
              sleep "$delay"
              delay=$((delay * 2))
            done
          }
          if ! command -v elan >/dev/null 2>&1; then
            retry bash -c 'curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none'
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show Lean and Lake versions
        shell: bash
        run: |
          set -euxo pipefail
          lean --version
          lake --version
          echo "[targeted] lake-cache-hit=${{ steps.lake-cache.outputs.cache-hit }}"

      - name: Build periodic translation bridge
        id: targeted-lean
        shell: bash
        run: |
          set +e
          set -o pipefail
          lake build \
            MGAP4D.MathlibAnalytic.PeriodicHypercubicTranslationInvariance \
            MGAP4D.MathlibAnalytic.PeriodicHypercubicIntegerTemporalTranslation \
            MGAP4D.MathlibAnalytic.PeriodicHypercubicSpecialUnitaryPhysicalTemporalAction 2>&1 \
            | tee /tmp/periodic-translation.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload targeted diagnostic log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: periodic-translation-log
          path: /tmp/periodic-translation.log
          if-no-files-found: error

      - name: Fail if targeted Lean build failed
        shell: bash
        run: exit "${{ steps.targeted-lean.outputs.status }}"
