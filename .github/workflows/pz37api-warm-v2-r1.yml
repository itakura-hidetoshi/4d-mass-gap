name: PZ37API warm sandbox v2 R1 fixed coupling signed vacuum
on:
  pull_request:
    paths:
      - "diagnostics/pz37api/warm-v2-r1/**"
      - ".github/workflows/pz37api-warm-v2-r1.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37api-warm-v2-r1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-v2.yml
    with:
      pack: diagnostics/pz37api/warm-v2-r1/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: 2c2b6a7c6cee7d49164b60a7476901d3ba69daca
