name: Lean Direct Elan CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  audit:
    name: Audit metadata and Lean source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify release manifest
        run: python3 scripts/verify_manifest.py
      - name: Audit Lean forbidden tokens
        run: python3 scripts/audit_lean_forbidden_tokens.py
      - name: Summarize Lean replay surface
        run: python3 scripts/replay_summary.py

  build:
    name: Build Lean project via direct elan
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Confirm direct elan workflow
        shell: bash
        run: |
          echo "USING_DIRECT_ELAN_WORKFLOW=1"
          pwd
          ls -la
          test -f lean-toolchain
      - name: Install elan and Lean toolchain
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Show Lean and Lake versions
        shell: bash
        run: |
          set -euxo pipefail
          lean --version
          lake --version
      - name: Generate Lake manifest
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          test -f lake-manifest.json
      - name: Build Lean project with lake build
        shell: bash
        run: |
          set -euxo pipefail
          lake build
