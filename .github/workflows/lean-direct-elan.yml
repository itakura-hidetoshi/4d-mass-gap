name: Lean Direct Elan CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mathlib-adoption/exact-gap-analytic

concurrency:
  group: lean-direct-elan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  audit:
    name: Audit metadata and Lean source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify release manifest
        run: python3 scripts/verify_manifest.py
      - name: Audit Lean forbidden tokens
        run: python3 scripts/audit_lean_forbidden_tokens.py
      - name: Audit major theorem non-placeholder surface
        run: python3 scripts/audit_major_theorem_nonplaceholder.py
      - name: Audit analytic bridge coherence
        run: python3 scripts/audit_bridge_coherence.py
      - name: Audit infinite-dimensional Yang-Mills target layer
        run: python3 scripts/audit_infinite_dimensional_target_layer.py
      - name: Audit infinite-dimensional residual filling bridge
        run: python3 scripts/audit_infinite_dimensional_residual_filling.py
      - name: Audit hard physical residual hardening map
        run: python3 scripts/audit_hard_physical_residual_hardening_map.py
      - name: Audit complete infinite-dimensional Hilbert construction
        run: python3 scripts/audit_complete_infinite_dimensional_hilbert_construction.py
      - name: Audit self-adjoint HPhys lane hardening
        run: python3 scripts/audit_self_adjoint_hphys_lane_hardening.py
      - name: Audit continuum Yang-Mills lane hardening
        run: python3 scripts/audit_continuum_yang_mills_lane_hardening.py
      - name: Audit plaquette spectral weight lane hardening
        run: python3 scripts/audit_plaquette_spectral_weight_lane_hardening.py
      - name: Audit four-lane residual closure
        run: python3 scripts/audit_four_lane_residual_closure.py
      - name: Audit internal review residual closure gate
        run: python3 scripts/audit_internal_review_residual_closure_gate.py
      - name: Summarize Lean replay surface
        run: python3 scripts/replay_summary.py

  build:
    name: Build Lean project via direct elan
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Confirm direct elan workflow
        shell: bash
        run: |
          echo "USING_DIRECT_ELAN_WORKFLOW=1"
          pwd
          ls -la
          test -f lean-toolchain
      - name: Cache elan and Lake build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake
          key: ${{ runner.os }}-lean-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lean-
            ${{ runner.os }}-lean-fast-
      - name: Install elan and Lean toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          retry() {
            local n=0
            local max=5
            local delay=10
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge "$max" ]; then
                echo "[direct-elan][retry] command failed after ${n} attempts: $*" >&2
                return 1
              fi
              echo "[direct-elan][retry] command failed; retry ${n}/${max} after ${delay}s: $*" >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          }
          if ! command -v elan >/dev/null 2>&1; then
            retry bash -c 'curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none'
          else
            echo "[direct-elan] using cached elan: $(command -v elan)"
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Show Lean and Lake versions
        shell: bash
        run: |
          set -euxo pipefail
          lean --version
          lake --version
      - name: Generate Lake manifest when needed
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -s lake-manifest.json ] || ! grep -q 'mathlib' lake-manifest.json; then
            lake update
          else
            echo "lake-manifest.json already contains mathlib; skipping lake update"
          fi
          test -f lake-manifest.json
      - name: Pull Mathlib cache when available
        shell: bash
        run: |
          set -euxo pipefail
          lake exe cache get || true
      - name: Build Lean project with lake build
        shell: bash
        run: |
          set -euxo pipefail
          lake build
