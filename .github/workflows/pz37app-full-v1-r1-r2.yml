name: PZ37APP full-cache sandbox v1 original OS vacuum-centered excitation
on:
  pull_request:
    paths:
      - "diagnostics/pz37app/full-v1-r1-r2/**"
      - ".github/workflows/pz37app-full-v1-r1-r2.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37app-full-v1-r1-r2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-diagnostic-full-v1.yml
    with:
      pack: diagnostics/pz37app/full-v1-r1-r2/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: 91359d0037d8214b107d1b5ccca3d8660c52ddc9
