name: Canonical Variation Spectral Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/canonical-homogeneity-diagnostic.yml"
      - "MGAP4D/MathlibAnalytic/FiniteLatticeWilsonCanonicalTotalVariationAlgebra.lean"
      - "MGAP4D/MathlibAnalytic/FiniteLatticeWilsonCanonicalTotalVariationHomogeneity.lean"
      - "MGAP4D/MathlibAnalytic/FiniteLatticeWilsonCanonicalTotalVariationSeminorm.lean"
      - "MGAP4D/MathlibAnalytic/FiniteLatticeWilsonCanonicalRandomScanEigenvalueBound.lean"
      - "MGAP4D/MathlibAnalytic/FiniteLatticeWilsonCanonicalHamiltonianEigenvalueBound.lean"

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-fast-
      - name: Install elan
        run: |
          if ! command -v elan >/dev/null 2>&1; then
            curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build canonical spectral bridge
        continue-on-error: true
        run: |
          set -o pipefail
          lake build \
            MGAP4D.MathlibAnalytic.FiniteLatticeWilsonCanonicalTotalVariationAlgebra \
            MGAP4D.MathlibAnalytic.FiniteLatticeWilsonCanonicalTotalVariationHomogeneity \
            MGAP4D.MathlibAnalytic.FiniteLatticeWilsonCanonicalTotalVariationSeminorm \
            MGAP4D.MathlibAnalytic.FiniteLatticeWilsonCanonicalRandomScanEigenvalueBound \
            MGAP4D.MathlibAnalytic.FiniteLatticeWilsonCanonicalHamiltonianEigenvalueBound \
            2>&1 | tee canonical-spectral.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-spectral-log
          path: canonical-spectral.log
