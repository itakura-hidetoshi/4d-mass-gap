name: PZ37AQU full-cache sandbox v1 uniform coefficient normalized quadratic floor
on:
  pull_request:
    paths:
      - "diagnostics/pz37aqu/full-v1-r1/**"
      - ".github/workflows/pz37aqu-full-v1-r1.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37aqu-full-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-aqu-full-v1.yml
    with:
      pack: diagnostics/pz37aqu/full-v1-r1/pack-r2.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: a699fd3d492d33d07731931cf9d55799df0f3b1d
