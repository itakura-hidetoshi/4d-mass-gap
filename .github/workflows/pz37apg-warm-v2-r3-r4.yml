name: PZ37APG warm sandbox v2 R3 R4 explicit inner scalar typing
on:
  pull_request:
    paths:
      - "diagnostics/pz37apg/warm-v2-r3-r4/**"
      - ".github/workflows/pz37apg-warm-v2-r3-r4.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37apg-warm-v2-r3-r4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-v2.yml
    with:
      pack: diagnostics/pz37apg/warm-v2-r3-r4/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: eeaf44e424ad4d6f7a5d1407613556f48683bdb7
