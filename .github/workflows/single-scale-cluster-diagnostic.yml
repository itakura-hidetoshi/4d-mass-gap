name: Single Scale Cluster Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/single-scale-cluster-diagnostic.yml"
      - "MGAP4D/MathlibAnalytic/FiniteWilsonOSAutomaticExactGapSingleScaleTransferOrbitContraction.lean"
      - "MGAP4D/MathlibAnalytic/FiniteWilsonOSAutomaticExactGapSingleScaleTransferOrbitContractionCompileSmoke.lean"

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"
  LAKE_CACHE_REF_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/cache@v5
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-
      - uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ env.LAKE_CACHE_REF_SHA }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-fast-lake-v4-
            ${{ runner.os }}-lean-fast-v3-
            ${{ runner.os }}-lean-fast-
            ${{ runner.os }}-lean-
      - name: Install Lean
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if ! command -v elan >/dev/null 2>&1; then
            curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Capture errors
        shell: bash
        run: |
          set +e
          lake env lean -DautoImplicit=false MGAP4D/MathlibAnalytic/FiniteWilsonOSAutomaticExactGapSingleScaleTransferOrbitContraction.lean > /tmp/full.log 2>&1
          status=$?
          echo "$status" > /tmp/status.txt
          grep -n -B 8 -A 40 -E 'error:|unsolved goals|Application type mismatch|failed to synthesize|tactic.*failed' /tmp/full.log > /tmp/errors.txt || tail -n 180 /tmp/full.log > /tmp/errors.txt
          exit 0
      - uses: actions/cache/save@v5
        with:
          path: |
            /tmp/errors.txt
            /tmp/status.txt
          key: single-scale-errors-${{ github.event.pull_request.head.sha }}

  report:
    if: always()
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v5
        with:
          path: |
            /tmp/errors.txt
            /tmp/status.txt
          key: single-scale-errors-${{ github.event.pull_request.head.sha }}
          fail-on-cache-miss: true
      - run: |
          cat /tmp/errors.txt
          test "$(cat /tmp/status.txt)" -eq 0
