name: PZ37APS full-cache sandbox v1 R5/R6 original OS independent endpoint Gauss descent
on:
  pull_request:
    paths:
      - "diagnostics/pz37aps/full-v1-r5-r6/**"
      - ".github/workflows/pz37aps-full-v1-r5-r6.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37aps-full-v1-r5-r6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-diagnostic-full-v1.yml
    with:
      pack: diagnostics/pz37aps/full-v1-r5-r6/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: f10540610a4fc559689546c10f92265bab938849
