name: PZ37AQK full-cache sandbox v1 finite relative decay horizon
on:
  pull_request:
    paths:
      - "diagnostics/pz37aqk/full-v1-r1-r2/**"
      - ".github/workflows/pz37aqk-full-v1-r1-r2.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37aqk-full-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-aqk-full-v1.yml
    with:
      pack: diagnostics/pz37aqk/full-v1-r1-r2/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: e3d4d9202dad356b16524f7133280f64c77914aa
