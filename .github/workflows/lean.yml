name: Lean CI

on:

  push:

    branches: [main]

  pull_request:

    branches: [main]

  workflow_dispatch:

jobs:

  build:

    name: Build Lean project

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

      - name: Set up Lean

        uses: leanprover/lean-action@v1

        with:

          use-github-cache: true

          build: true
