name: PZ37APE APF shared warm sandbox v2
on:
  pull_request:
    paths:
      - "diagnostics/pz37ape-apf/warm-v2/**"
      - ".github/workflows/pz37ape-apf-warm-v2.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37ape-apf-warm-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-v2.yml
    with:
      pack: diagnostics/pz37ape-apf/warm-v2/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: dbdcc14fc3c54f38eaee8af96672acd27160cbc6
