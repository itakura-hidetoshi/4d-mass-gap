name: PZ37AQP full-cache sandbox v1 genuine vacuum-weighted probe floor
on:
  pull_request:
    paths:
      - "diagnostics/pz37aqp/full-v1-r1/**"
      - ".github/workflows/pz37aqp-full-v1-r1.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37aqp-full-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-aqp-full-v1.yml
    with:
      pack: diagnostics/pz37aqp/full-v1-r1/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: d401555b432add745150c1c28d3e54a0fae59e64
