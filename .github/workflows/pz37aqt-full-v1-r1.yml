name: PZ37AQT full-cache sandbox v1 integrated normalized quadratic floor
on:
  pull_request:
    paths:
      - "diagnostics/pz37aqt/full-v1-r1/**"
      - ".github/workflows/pz37aqt-full-v1-r1.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37aqt-full-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-aqt-full-v1.yml
    with:
      pack: diagnostics/pz37aqt/full-v1-r1/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: ac6e34e380b61038dc25f6950736e74676223bc3
