name: Bridge Coherence CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  bridge-coherence:
    name: Check bridge coherence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check Lean forbidden tokens
        run: python3 scripts/audit_lean_forbidden_tokens.py
      - name: Check major theorem non-placeholder surface
        run: python3 scripts/audit_major_theorem_nonplaceholder.py
      - name: Check analytic bridge coherence
        run: python3 scripts/audit_bridge_coherence.py
      - name: Check infinite-dimensional Yang-Mills target layer
        run: python3 scripts/audit_infinite_dimensional_target_layer.py
      - name: Check infinite-dimensional residual filling bridge
        run: python3 scripts/audit_infinite_dimensional_residual_filling.py
      - name: Check hard physical residual hardening map
        run: python3 scripts/audit_hard_physical_residual_hardening_map.py
      - name: Check Hilbert construction lane hardening
        run: python3 scripts/audit_hilbert_construction_lane_hardening.py
      - name: Check self-adjoint HPhys lane hardening
        run: python3 scripts/audit_self_adjoint_hphys_lane_hardening.py
      - name: Check continuum Yang-Mills lane hardening
        run: python3 scripts/audit_continuum_yang_mills_lane_hardening.py
      - name: Check plaquette spectral weight lane hardening
        run: python3 scripts/audit_plaquette_spectral_weight_lane_hardening.py
      - name: Check four-lane residual closure
        run: python3 scripts/audit_four_lane_residual_closure.py
      - name: Summarize Lean replay surface
        run: python3 scripts/replay_summary.py
