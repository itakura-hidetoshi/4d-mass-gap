name: PZ37AQA full-cache sandbox v1 local support composition
on:
  pull_request:
    paths:
      - "diagnostics/pz37aqa/full-v1-r1-r3/**"
      - ".github/workflows/pz37aqa-full-v1-r1-r3.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37aqa-full-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-diagnostic-full-v1.yml
    with:
      pack: diagnostics/pz37aqa/full-v1-r1-r3/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: 0ef21e868aca40ce073aa72a373e6f0df1f9a5fb
