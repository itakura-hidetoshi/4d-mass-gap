name: PZ37ANZ pinned KuuOS-native CodeAI replay

on:
  pull_request:
    paths:
      - "MGAP4D/MathlibAnalytic/PhysicalYangMillsWilsonSU2OriginalFirstHaarQuantitativeTopSlopeV5_PZ37ANZ.lean"
      - "scripts/pz37anz_codeai_native_candidate_replay.py"
      - ".github/workflows/pz37anz-kuuos-native-codeai.yml"
  push:
    branches:
      - research/p4-q2-pz37-anz-original-physical-top-first-quantitative-slope-20261122
    paths:
      - "MGAP4D/MathlibAnalytic/PhysicalYangMillsWilsonSU2OriginalFirstHaarQuantitativeTopSlopeV5_PZ37ANZ.lean"
      - "scripts/pz37anz_codeai_native_candidate_replay.py"
      - ".github/workflows/pz37anz-kuuos-native-codeai.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeai-native-candidate-replay:
    name: Native CodeAI source-bound proposal and governance audit
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout current ANZ research source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout immutable KuuOS-native CodeAI source
        uses: actions/checkout@v6
        with:
          repository: itakura-hidetoshi/KuuOS
          ref: b0201811d176bf25fb50146d380def6fa2e90fa7
          path: _codeai_pinned
          sparse-checkout: |
            runtime
            examples
          persist-credentials: false

      - name: Execute native deterministic CodeAI candidate synthesis
        env:
          KUUOS_CODEAI_PINNED_ROOT: "${{ github.workspace }}/_codeai_pinned"
          PYTHONPATH: "${{ github.workspace }}/_codeai_pinned"
          ANZ_HEAD: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python3 scripts/pz37anz_codeai_native_candidate_replay.py

      - name: Publish readonly candidate receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: PZ37ANZ-kuuos-native-codeai-candidate-receipts
          path: "${{ runner.temp }}/anz-codeai-native.json"
          if-no-files-found: warn
          retention-days: 14
