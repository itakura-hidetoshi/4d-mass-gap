name: Temporary Even Periodic Stack Log

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build even-periodic stack
        id: build
        continue-on-error: true
        run: |
          lake build MGAP4D.MathlibAnalytic.PhysicalYangMillsOrientedWilsonOSEvenPeriodicLocalKernelProduct > /tmp/lean.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          grep -n -E 'error:|failed to synthesize|application type mismatch|unknown identifier' /tmp/lean.log | head -n 80 || true
          tail -n 160 /tmp/lean.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: even-periodic-stack-log
          path: /tmp/lean.log
      - name: Fail on error
        if: steps.build.outputs.status != '0'
        run: exit 1
