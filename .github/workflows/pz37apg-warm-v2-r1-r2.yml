name: PZ37APG warm sandbox v2 R1 R2 corrected full top split
on:
  pull_request:
    paths:
      - "diagnostics/pz37apg/warm-v2-r1-r2/**"
      - ".github/workflows/pz37apg-warm-v2-r1-r2.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37apg-warm-v2-r1-r2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-v2.yml
    with:
      pack: diagnostics/pz37apg/warm-v2-r1-r2/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: eeaf44e424ad4d6f7a5d1407613556f48683bdb7
