name: PZ37AOZ R2 warm compact v2
on:
  pull_request:
    paths:
      - "diagnostics/pz37aoz-apa/warm-v2/**"
      - ".github/workflows/pz37aoz-r2-warm-v2.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pz37aoz-r2-warm-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/lean-warm-sandbox-reusable-v2.yml
    with:
      pack: diagnostics/pz37aoz-apa/warm-v2/pack.json
      source_head: ${{ github.event.pull_request.head.sha || github.sha }}
      baseline_commit: 5ce269760ead123fdd96f12bfbc57a2b6bfb3955
