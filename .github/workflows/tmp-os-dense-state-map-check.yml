name: Temporary OS Dense State Map Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/tmp-os-dense-state-map-check.yml"
      - "MGAP4D/MathlibAnalytic/PhysicalYangMillsGaugeInvariantOSDenseStateMap.lean"

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"

jobs:
  os-dense-state-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache elan toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-

      - name: Restore Lake build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake
            lake-manifest.json
          key: ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-fast-lake-v5-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-fast-lake-v4-
            ${{ runner.os }}-lean-fast-v3-
            ${{ runner.os }}-lean-fast-
            ${{ runner.os }}-lean-

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v elan >/dev/null 2>&1; then
            curl --retry 5 --retry-delay 10 --retry-all-errors -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build diagnostic target
        id: build
        shell: bash
        run: |
          set +e
          lake build MGAP4D.MathlibAnalytic.PhysicalYangMillsGaugeInvariantOSDenseStateMap > /tmp/os-dense-state-map.log 2>&1
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic log
        uses: actions/upload-artifact@v6
        with:
          name: os-dense-state-map-log
          path: /tmp/os-dense-state-map.log
          if-no-files-found: error

      - name: Fail if Lean failed
        shell: bash
        run: exit "${{ steps.build.outputs.status }}"
